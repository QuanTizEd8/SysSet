ubuntu-stable:
  ordinary:
    env: ubuntu-stable+lib-test-tools
    env_vars:
      DEVFEATS_TEST_TOOL_CACHE: required
      DEVFEATS_TEST_TOOL_SOURCE_DIR: /opt/devfeats/lib-test-tools/bin
  bootstrap:
    env: ubuntu-stable
    env_vars:
      DEVFEATS_TEST_TOOL_CACHE: disabled

debian-stable:
  ordinary:
    env: debian-stable+bash+lib-test-tools
    env_vars:
      DEVFEATS_TEST_TOOL_CACHE: required
      DEVFEATS_TEST_TOOL_SOURCE_DIR: /opt/devfeats/lib-test-tools/bin
  bootstrap:
