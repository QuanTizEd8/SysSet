# Every scenario except the ones below is now auto-generated from
# features/install-opencode/metadata.yaml (_options.verify.functional,
# _options.version.test_pins, _options.method, _options.prefix, if_exists,
# invalid enum values, log_file) by .dev/lib/proman/test/gen/. See
# test/features/generation.yaml for the generator config, and run
# `proman-test-gen-preview install-opencode` to inspect the generated output.
#
# package_pacman dropped as redundant: the generated package_default already
# selects archlinux-current — the only env in the pool offering pacman, the
# one PM opencode's `package` method targets (`when: {plat.pm: [brew,
# pacman]}`, and brew isn't in the Linux-container env pool) — so it's the
# exact same coverage.
#
# binary_musl stays hand-written: verifies LIBC detection selects the musl
# binary variant on Alpine — no generic concept of a libc dimension exists in
# the generator.
#
# persist_dirs/persist_dirs_custom stay hand-written: workspace-symlink
# onCreateCommand behavior is a devcontainer-lifecycle concern with no
# generic rule (a future rule could absorb this, but that's out of scope
# here).

binary_musl:
  envs: [alpine-current+bash]
  options:
    method: binary
  tests: [binary_musl]

# persist_dirs shares the default install-key (options={}, devcontainer) but
# verifies the devcontainer onCreateCommand symlinks (~/.config,~/.local/share)
# — a devcontainer-only behavior absent in default's standalone run, so it
# cannot augment the dual-mode `default` and stays a separate scenario.
persist_dirs:
  envs: [ubuntu-stable]
  modes: [devcontainer]
  tests: [persist_dirs]

persist_dirs_custom:
  envs: [ubuntu-stable]
  modes: [devcontainer]
  options:
    config_dir: .config/opencode
    data_dir: .local/share/opencode
  tests: [persist_dirs_custom]
