# Golden groups (default, setup_zsh_true, …) assert the whole deployed tree
# byte-for-byte against reviewed fixtures under expected/<scenario>/ via
# support/assert_golden.sh. Regenerate with generate_golden.py — but NEVER
# commit a regenerated fixture set without manually reviewing the diff, because
# fixtures are produced by the same installer the tests exercise.
#
# The remaining groups are declarative (targeted grep/test) for narrow
# assertions, devcontainer smoke, and install-failure cases.

# ── Golden groups (one per golden scenario) ─────────────────────────────────

default:
  description: The full bash-only deployment (system files + root dotfiles) matches the reviewed golden fixtures.
  checks:
    - title: deployed tree matches golden fixtures
      cmd: |-
        bash -c '. "${REPO_ROOT}/test/features/setup-shell/support/assert_golden.sh"; ss_assert_golden default'

setup_zsh_true:
  description: The full bash+zsh deployment matches the reviewed golden fixtures.
  checks:
    - title: deployed tree matches golden fixtures
      cmd: |-
        bash -c '. "${REPO_ROOT}/test/features/setup-shell/support/assert_golden.sh"; ss_assert_golden setup_zsh_true'

setup_system_false:
  description: With setup_system=false only per-user dotfiles are deployed; the tree matches golden.
  checks:
    - title: deployed tree matches golden fixtures
      cmd: |-
        bash -c '. "${REPO_ROOT}/test/features/setup-shell/support/assert_golden.sh"; ss_assert_golden setup_system_false'

if_exists_reinstall_foreign_bashrc:
  description: reinstall assembles a fresh tree (custom line gone) matching golden.
  checks:
    - title: deployed tree matches golden fixtures
      cmd: |-
        bash -c '. "${REPO_ROOT}/test/features/setup-shell/support/assert_golden.sh"; ss_assert_golden if_exists_reinstall_foreign_bashrc'

if_exists_update_foreign_bashrc:
  description: update injects blocks while preserving the custom admin line; the tree matches golden.
  checks:
    - title: deployed tree matches golden fixtures
      cmd: |-
        bash -c '. "${REPO_ROOT}/test/features/setup-shell/support/assert_golden.sh"; ss_assert_golden if_exists_update_foreign_bashrc'

block_disable_history:
  description: Disabling block_sys_bashrc_history omits only that block; the tree matches golden.
  checks:
    - title: deployed tree matches golden fixtures
      cmd: |-
        bash -c '. "${REPO_ROOT}/test/features/setup-shell/support/assert_golden.sh"; ss_assert_golden block_disable_history'

add_users:
  description: An explicit user is configured (root is not); the tree matches golden.
  checks:
    - title: deployed tree matches golden fixtures
      cmd: |-
        bash -c '. "${REPO_ROOT}/test/features/setup-shell/support/assert_golden.sh"; ss_assert_golden add_users'

no_user_bashtheme:
  description: Empty user_bashtheme deploys no scaffold and no source hook; the tree matches golden.
  checks:
    - title: deployed tree matches golden fixtures
      cmd: |-
        bash -c '. "${REPO_ROOT}/test/features/setup-shell/support/assert_golden.sh"; ss_assert_golden no_user_bashtheme'

update_rerun_idempotent:
  description: |-
    A second update run is byte-for-byte idempotent — the tree still matches the
    `default` golden fixtures (fixture dir is shared with the default scenario;
    both runs use identical options).
  checks:
    - title: deployed tree matches golden fixtures after a re-run
      cmd: |-
        bash -c '. "${REPO_ROOT}/test/features/setup-shell/support/assert_golden.sh"; ss_assert_golden default'

# ── Declarative supplements / smoke ─────────────────────────────────────────

uninstall_after_install:
  description: Uninstall removes managed files, strips markers from pre-existing files, and preserves foreign content.
  checks:
    - title: no file at /etc/shellenv
      cmd: bash -c '! test -f /etc/shellenv'
    - title: no file at /etc/shellrc
      cmd: bash -c '! test -f /etc/shellrc'
    - title: no file at /etc/bashenv
      cmd: bash -c '! test -f /etc/bashenv'
    - title: no BASH_ENV line in /etc/environment
      cmd: bash -c '! grep -q "^BASH_ENV=" /etc/environment'
    - title: stock system bashrc retained without markers
      cmd: bash -c 'test -f /etc/bash.bashrc && ! grep -q "setup-shell-" /etc/bash.bashrc'
    - title: stock /etc/profile retained without markers
      cmd: bash -c 'test -f /etc/profile && ! grep -q "setup-shell-" /etc/profile'
    - title: stock root .bashrc retained without markers
      cmd: bash -c 'test -f /root/.bashrc && ! grep -q "setup-shell-" /root/.bashrc'
    - title: no file at /root/.shellenv
      cmd: bash -c '! test -f /root/.shellenv'

if_exists_fail_skel_aborts_all:
  description: A skel-scope fail conflict aborts every scope with zero writes.
  checks:
    - kind: install_failure
      title: skel conflict reported with target id and path
      pattern: "[skel_bashrc] /etc/skel/.bashrc"
    - title: sys scope wrote nothing (no /etc/shellenv)
      cmd: bash -c '! test -f /etc/shellenv'
    - title: stock skel .bashrc untouched
      cmd: bash -c '! grep -q "setup-shell-" /etc/skel/.bashrc'

if_exists_fail_user_probed:
  description: An add_users user is covered by the fail probe; a conflict aborts all scopes.
  checks:
    - kind: install_failure
      title: user conflict reported with the user's path
      pattern: "/home/devuser/.bashrc"
    - title: sys scope wrote nothing (no /etc/shellenv)
      cmd: bash -c '! test -f /etc/shellenv'
    - title: devuser .bashrc untouched
      cmd: bash -c '! grep -q "setup-shell-" /home/devuser/.bashrc'

skip_still_configures_new_user:
  description: System-scope skip on an existing foreign file does not block per-user configuration.
  checks:
    - title: foreign shellenv preserved untouched
      cmd: bash -c 'grep -qF "FOREIGN SHELLENV" /etc/shellenv && ! grep -q "setup-shell-" /etc/shellenv'
    - title: devuser .shellenv deployed
      cmd: test -f /home/devuser/.shellenv
    - title: devuser .bashrc got managed blocks
      cmd: grep -qF 'setup-shell-user-bashrc-shellrc' /home/devuser/.bashrc

update_resync_dynamic_block:
  description: Changing a dynamic block option between runs re-syncs the managed block in place.
  checks:
    - title: umask block synced to the new value
      cmd: grep -qF 'umask 077' /etc/shellenv
    - title: old umask value gone
      cmd: bash -c '! grep -qF "umask 022" /etc/shellenv'

custom_user_bashtheme:
  description: A custom user_bashtheme path gets the scaffold and the bashrc source hook.
  checks:
    - title: scaffold exists at the custom path
      cmd: test -f /tmp/mybashtheme
    - title: bashrc hook sources the custom path
      cmd: grep -qF '_BASH_THEME="/tmp/mybashtheme"' /root/.bashrc

xdg_custom_config_home:
  description: A custom XDG_CONFIG_HOME flows into system, skel, and user shellenv (guarded).
  checks:
    - title: system shellenv exports the custom guarded default
      cmd: |-
        grep -qF 'XDG_CONFIG_HOME:-${HOME}/.local/config' /etc/shellenv
    - title: skel shellenv mirrors the custom guarded default
      cmd: |-
        grep -qF 'XDG_CONFIG_HOME:-${HOME}/.local/config' /etc/skel/.shellenv
    - title: user shellenv mirrors the custom guarded default
      cmd: |-
        grep -qF 'XDG_CONFIG_HOME:-${HOME}/.local/config' /root/.shellenv

reinstall_backup:
  description: reinstall backed up the original bashrc before replacing it.
  checks:
    - title: a backup of the original bashrc exists
      cmd: bash -c 'ls /usr/local/share/*/*/setup-shell/backups/etc_bash.bashrc.* > /dev/null 2>&1'

reinstall_preserves_managed_block:
  description: reinstall preserves a foreign guarded managed block by default.
  checks:
    - title: foreign block marker preserved
      cmd: grep -qF '# >>> prefix activation (install-homebrew) >>>' /etc/bash.bashrc
    - title: foreign block content preserved
      cmd: grep -qF 'HOMEBREW_PREFIX=/home/linuxbrew/.linuxbrew' /etc/bash.bashrc
    - title: setup-shell own blocks (re)assembled alongside it
      cmd: grep -q 'setup-shell-' /etc/bash.bashrc
    - title: foreign block present exactly once (not duplicated)
      cmd: bash -c 'test "$(grep -cF "# >>> prefix activation (install-homebrew) >>>" /etc/bash.bashrc)" = 1'

reinstall_preserve_disabled_drops_block:
  description: reinstall with preserve_managed_blocks=false drops foreign blocks from the live file (kept only in backup).
  checks:
    - title: foreign block removed from the live file
      cmd: bash -c '! grep -qF "prefix activation (install-homebrew)" /etc/bash.bashrc'
    - title: setup-shell own blocks still assembled
      cmd: grep -q 'setup-shell-' /etc/bash.bashrc
    - title: foreign block survives in a backup copy
      cmd: bash -c 'grep -rqlF "prefix activation (install-homebrew)" /usr/local/share/*/*/setup-shell/backups'

reinstall_managed_block_allowlist:
  description: managed_block_markers preserves only markers matching the allowlist glob.
  checks:
    - title: allowlisted install-* block preserved
      cmd: grep -qF '# >>> prefix activation (install-homebrew) >>>' /etc/bash.bashrc
    - title: non-matching personal block dropped
      cmd: bash -c '! grep -qF "my-personal-tweaks" /etc/bash.bashrc'

system_files:
  description: Shared system files and the system bashrc are deployed and syntactically valid.
  checks:
    - title: /etc/shellenv exists
      cmd: test -f /etc/shellenv
    - title: /etc/shellrc exists
      cmd: test -f /etc/shellrc
    - title: /etc/shellaliases exists
      cmd: test -f /etc/shellaliases
    - title: /etc/profile exists
      cmd: test -f /etc/profile
    - title: extend_path helper defined in shellenv
      cmd: grep -qF 'extend_path()' /etc/shellenv
    - title: shellenv is valid POSIX sh
      cmd: sh -n /etc/shellenv
    - title: system bashrc sources shellrc
      cmd: grep -qF 'setup-shell-sys-bashrc-shellrc' /etc/bash.bashrc
    - title: system bashrc is valid bash
      cmd: bash -n /etc/bash.bashrc
    - title: BASH_ENV set in /etc/environment
      cmd: grep -q '^BASH_ENV=' /etc/environment

root_dotfiles:
  description: Root's per-user dotfiles are deployed and sourced.
  checks:
    - title: root .shellenv exists
      cmd: test -f /root/.shellenv
    - title: root .bashrc sources shellrc
      cmd: grep -qF 'setup-shell-user-bashrc-shellrc' /root/.bashrc
    - title: root .bash_profile exists
      cmd: test -f /root/.bash_profile

no_zsh_system_files:
  description: |-
    When setup_zsh=false, setup-shell deploys no zsh configuration. The zsh
    package itself ships stock /etc/zsh files, so the assertion is that they
    carry no setup-shell markers — not that they are absent.
  checks:
    - title: no setup-shell markers in the system zsh config
      cmd: bash -c '! grep -rq "setup-shell-" /etc/zsh 2>/dev/null'
    - title: no root .zshenv
      cmd: bash -c '! test -f /root/.zshenv'

no_bash_system_files:
  description: When setup_bash=false, no bash-specific system files are deployed.
  checks:
    - title: shared shellenv still deployed
      cmd: test -f /etc/shellenv
    - title: no BASH_ENV line
      cmd: bash -c '! grep -q "^BASH_ENV=" /etc/environment'
    - title: no setup-shell markers in the stock system bashrc
      cmd: bash -c '! grep -q "setup-shell-sys-bashrc" /etc/bash.bashrc'
    - title: no setup-shell hooks in the stock root .bashrc
      cmd: bash -c '! grep -q "setup-shell-user-bashrc" /root/.bashrc'

skel_files:
  description: Skel templates are deployed for new-user seeding.
  checks:
    - title: /etc/skel/.shellenv exists
      cmd: test -f /etc/skel/.shellenv
    - title: /etc/skel/.bashrc exists
      cmd: test -f /etc/skel/.bashrc
    - title: /etc/skel/.zshenv exists
      cmd: test -f /etc/skel/.zshenv
    - title: /etc/skel ZDOTDIR .zshrc exists
      cmd: test -f /etc/skel/.config/zsh/.zshrc

skip_existing_shellenv:
  description: skip leaves a pre-existing foreign shellenv untouched.
  checks:
    - title: foreign shellenv content preserved
      cmd: grep -qF 'FOREIGN SHELLENV' /etc/shellenv
    - title: no setup-shell markers injected
      cmd: bash -c '! grep -q "setup-shell-shellenv" /etc/shellenv'

fail_conflict:
  description: fail aborts non-zero, lists every conflicting target, and writes nothing.
  checks:
    - kind: install_failure
      title: if_exists=fail refuses to modify existing files
      pattern: "if_exists=fail"
    - kind: install_failure
      title: conflict list names the system bashrc target
      pattern: "[sys_bashrc] /etc/bash.bashrc"
    - kind: install_failure
      title: conflict list names the profile target
      pattern: "[sys_profile] /etc/profile"
    - title: nothing was written (no /etc/shellenv)
      cmd: bash -c '! test -f /etc/shellenv'

custom_sys_shellaliases:
  description: A custom sys_shellaliases path is honored end to end.
  checks:
    - title: aliases file at custom path
      cmd: test -f /etc/my-aliases
    - title: default path not used
      cmd: bash -c '! test -f /etc/shellaliases'
    - title: shellrc sources the custom aliases path
      cmd: grep -qF '/etc/my-aliases' /etc/shellrc

custom_sys_shellenv:
  description: A custom sys_shellenv path moves the file and every source line referencing it.
  checks:
    - title: shellenv at custom path
      cmd: test -f /etc/my-shellenv
    - title: default path not used
      cmd: bash -c '! test -f /etc/shellenv'
    - title: /etc/profile sources the custom path
      cmd: grep -qF '. "/etc/my-shellenv"' /etc/profile
    - title: shellrc sources the custom path
      cmd: grep -qF '. "/etc/my-shellenv"' /etc/shellrc
    - title: bashenv sources the custom path
      cmd: grep -qF '. "/etc/my-shellenv"' /etc/bashenv
    - title: zsh zshenv sources the custom path (emulate sh)
      cmd: grep -qF '/etc/my-shellenv' /etc/zsh/zshenv

custom_user_zshtheme:
  description: A custom user_zshtheme path gets the scaffold and the zshrc source hook.
  checks:
    - title: scaffold exists at the custom path
      cmd: test -f /tmp/myzshtheme
    - title: zshrc hook sources the custom path
      cmd: grep -qF 'source "/tmp/myzshtheme"' /root/.config/zsh/.zshrc
    - title: default scaffold path not used
      cmd: bash -c '! test -f /root/.config/zsh/zshtheme'

no_sys_shellaliases:
  description: An empty sys_shellaliases skips the file and omits its source line.
  checks:
    - title: no aliases file deployed
      cmd: bash -c '! test -f /etc/shellaliases'
    - title: shellrc carries no shellaliases source block
      cmd: bash -c '! grep -q "shellaliases" /etc/shellrc'
    - title: shellrc itself still deployed
      cmd: test -f /etc/shellrc

block_disable_on_update:
  description: Disabling a block on a re-run removes its managed marker in place, leaving other blocks intact.
  checks:
    - title: history marker removed from the system bashrc
      cmd: bash -c '! grep -q "setup-shell-sys-bashrc-history" /etc/bash.bashrc'
    - title: history content gone
      cmd: bash -c '! grep -q "HISTIGNORE" /etc/bash.bashrc'
    - title: other managed blocks intact
      cmd: grep -qF 'setup-shell-sys-bashrc-shellrc' /etc/bash.bashrc

setup_skel_false:
  description: setup_skel=false deploys nothing to /etc/skel while system and user config still deploy.
  checks:
    - title: no setup-shell markers anywhere under /etc/skel
      cmd: bash -c '! grep -rq "setup-shell-" /etc/skel 2>/dev/null'
    - title: no managed skel shellenv
      cmd: bash -c '! test -f /etc/skel/.shellenv'
    - title: system shellenv still deployed
      cmd: test -f /etc/shellenv
    - title: root dotfiles still deployed
      cmd: test -f /root/.shellenv

custom_locale_editor:
  description: Custom locale and editor values are written to shellenv.
  checks:
    - title: custom locale exported
      cmd: grep -qF 'C.UTF-8' /etc/shellenv
    - title: editor set to vim
      cmd: grep -qF 'VISUAL=vim' /etc/shellenv

zdotdir_custom:
  description: A custom zdotdir places zsh config in the requested directory.
  checks:
    - title: custom ZDOTDIR .zshrc exists
      cmd: test -f /root/.zsh/.zshrc
    - title: .zshenv exports the custom ZDOTDIR
      cmd: grep -qF '/root/.zsh' /root/.zshenv
    - title: default ZDOTDIR not used
      cmd: bash -c '! test -f /root/.config/zsh/.zshrc'

no_bash_env:
  description: setup_bash_env=false omits the BASH_ENV line.
  checks:
    - title: no BASH_ENV in /etc/environment
      cmd: bash -c '! grep -q "^BASH_ENV=" /etc/environment'
    - title: shared shellenv still deployed
      cmd: test -f /etc/shellenv
