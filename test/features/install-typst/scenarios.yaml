# Every scenario is now auto-generated from features/install-typst/metadata.yaml
# (_options.verify.functional, _options.version.test_pins, _options.method,
# _options.prefix, _options.completions, if_exists, invalid enum values,
# log_file) by .dev/lib/proman/test/gen/. See test/features/generation.yaml
# for the generator config, and run `proman-test-gen-preview install-typst`
# to inspect the generated output.
#
# generation.suppress.scenarios drops custom_prefix_symlink_nonroot: typst's
# binary release is a .tar.xz archive, and extracting it needs xz, which —
# unlike jq/yq — has no privilege-free bootstrap path (bootstrap__xz only
# installs via the OS package manager). A nonroot user without xz already on
# the base image genuinely cannot install via method=binary — the same
# constraint confirmed via a real Docker run for install-shellcheck.
#
# Dropped as now-generated/superseded: binary_custom_prefix declared
# if_exists: reinstall with no setup: seeding a pre-existing install, so
# if_exists was inert — substantively identical to the generated
# custom_prefix_symlink. reinstall (with a real setup: stub + version pin)
# is now covered exactly by the generated if_exists_reinstall, which also
# pins version to test_pins.pinned[0] once declared.
generation:
  suppress:
    scenarios: [custom_prefix_symlink_nonroot]
