# Every check group is auto-generated except package_default below — see
# scenarios.yaml for why.

package_default:
  description: 'method=package: installs via the OS package manager''s standard configured
    sources.'
  checks:
    - title: shfmt is on PATH
      cmd: command -v shfmt
    - title: shfmt binary is executable
      cmd: bash -c 'test -x "$(command -v shfmt)"'
    - title: shfmt formats shell code
      cmd: bash -c 'printf "if true\nthen\necho hi\nfi\n" | shfmt -'
    - title: binary is package-manager-managed
      kind: multiple
      min: 1
      cmd:
        - bash -c 'apk info -e shfmt >/dev/null 2>&1'
        - bash -c 'dpkg -S "$(command -v shfmt)" >/dev/null 2>&1'
        - bash -c 'rpm -qf "$(command -v shfmt)" >/dev/null 2>&1'
        - bash -c 'pacman -Qo "$(command -v shfmt)" >/dev/null 2>&1'
