# Every scenario is now auto-generated from features/install-shfmt/metadata.yaml
# (_options.verify.functional, _options.method, _options.prefix, if_exists,
# invalid enum values, log_file) by .dev/lib/proman/test/gen/. See
# test/features/generation.yaml for the generator config, and run
# `proman-test-gen-preview install-shfmt` to inspect the generated output.
#
# The prior hand-written binary_custom_prefix scenario combined a custom
# prefix with if_exists: reinstall, but declared no setup: seeding a
# pre-existing install — so if_exists was inert (nothing to reinstall over),
# making it a fresh custom-prefix install identical in substance to the
# generated custom_prefix_symlink.
#
# generation.suppress.checks drops the generated package_default check
# group only (the scenario itself — envs, options — is still generated):
# Fedora's dnf and openSUSE's zypper package shfmt from a build that never
# stamped a version string via -ldflags, so `shfmt --version` prints nothing
# on Fedora and the Go-default `(devel)` on openSUSE, both confirmed via a
# real Docker run — a real distro-packaging gap, not a broken install. jq
# (C) and ripgrep (Rust) packages on the same Fedora image report real
# versions, confirming this is specific to shfmt's Go build on these two
# distros rather than a systemic package_default problem worth weakening
# the generic version-format check for everyone.
generation:
  suppress:
    checks: [package_default]
