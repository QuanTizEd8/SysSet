# Every other scenario is auto-generated from features/install-go/metadata.yaml
# (_options.verify.functional, _options.version.test_pins, _options.method,
# _options.prefix, if_exists, invalid enum values, log_file) by
# .dev/lib/proman/test/gen/. See test/features/generation.yaml for the
# generator config, and run `proman-test-gen-preview install-go` to inspect
# the generated output.
#
# goroot_and_cross_compile exercises install-go-specific behavior (GOROOT
# export, GOOS/GOARCH cross-compilation) with no options/setup of its own, so
# it AUGMENTS the generated `default` install rather than re-installing — its
# checks run in that one install. cgo_enabled sets cgo_deps (a distinct
# install), so it stays a separate scenario.

generation:
  augment_tests:
    default: [goroot_and_cross_compile]

cgo_enabled:
  envs: [ubuntu-stable]
  modes: [standalone]
  options:
    cgo_deps: true
  tests: [cgo_enabled]
