# Every other scenario is auto-generated from features/install-go/metadata.yaml
# (_options.verify.functional, _options.version.test_pins, _options.method,
# _options.prefix, if_exists, invalid enum values, log_file) by
# .dev/lib/proman/test/gen/. See test/features/generation.yaml for the
# generator config, and run `proman-test-gen-preview install-go` to inspect
# the generated output.
#
# goroot_and_cross_compile and cgo_enabled exercise install-go-specific
# behavior (GOROOT export, GOOS/GOARCH cross-compilation, the cgo_deps
# option) that has no generic representation in the generator.

goroot_and_cross_compile:
  envs: [ubuntu-stable]
  modes: [standalone]
  tests: [goroot_and_cross_compile]

cgo_enabled:
  envs: [ubuntu-stable]
  modes: [standalone]
  options:
    cgo_deps: true
  tests: [cgo_enabled]
