enabled: true
rollout:
  mode: allowlist
  allowlist:
  - install-jq
  - install-act
  - install-copilot
  - install-codex
  - install-opencode
  - install-claude
  - install-ripgrep
  - install-shfmt
  - install-just
  - install-shellcheck
  - install-typst
  - install-uv
  - install-yq
  - install-lefthook
  - install-taskfile
  - install-jsonschema
  - install-fzf
  - install-ruff
  - install-direnv
  - install-devcontainer-cli
  - install-go
  - install-rust
  - install-tokei
  - install-zsh
  - install-oras
  - install-git
  - install-git-lfs
  - install-bash
  - install-gh
  - install-starship
  - install-pixi
  - install-node
  - install-pnpm
  - install-yarn
  - install-ohmybash
  - install-ohmyzsh
  - install-ripgrep-all
  - install-homebrew
  - install-miniforge
  - install-texlive
  - install-pandoc
  - install-cursor
  denylist:
  - install
  - install-os-pkg
  - install-os-pkg-bundle
  - install-fonts
  - setup-shell
  - setup-files
  - setup-shim
  - setup-user
  - install-bash-completion
  - install-zsh-completion
  - install-nvm
  - install-conda-env
  - install-podman
environments:
  primary: ubuntu-stable
  nonroot_env: ubuntu-stable+vscode
  npm_env: ubuntu-stable+node
  cargo_env: ubuntu-current+rust
  pool:
  - ubuntu-stable
  - debian-stable+bash
  - alpine-current+bash
  - fedora-current+bash
  - rockylinux-current+bash
  - opensuse-leap-current+bash
  - archlinux-current
families:
  existence_default:
    enabled: true
    modes:
    - devcontainer
    - standalone
  version_pinning:
    enabled: true
    modes:
    - devcontainer
    - standalone
  method_matrix:
    enabled: true
    modes:
    - standalone
    select: one_per_pm
  if_exists:
    enabled: true
    modes:
    - standalone
  prefix_symlink:
    enabled: true
    modes:
    - devcontainer
    - standalone
  invalid_enum:
    enabled: true
    modes:
    - standalone
    options:
    - method
    - if_exists
  completions:
    enabled: true
    modes:
    - standalone
  configure_users:
    enabled: false
    reason: Scenario scaffolding only generates a scaffold that requires a hand-authored
      checks.yaml group; opt in per feature once that group exists.
  installer_dir:
    enabled: true
    modes:
    - devcontainer
    - standalone
  log_file:
    enabled: true
    modes:
    - standalone
assertions:
  require_anchored_regex: true
  version_cross_validate: true
  functional_smoke_required: true
