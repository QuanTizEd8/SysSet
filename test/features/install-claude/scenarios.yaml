# Every scenario except the ones below is now auto-generated from
# features/install-claude/metadata.yaml (_options.verify.functional,
# _options.version.test_pins, _options.method, _options.prefix, if_exists,
# invalid enum values, log_file) by .dev/lib/proman/test/gen/. See
# test/features/generation.yaml for the generator config, and run
# `proman-test-gen-preview install-claude` to inspect the generated output.
#
# binary_musl stays hand-written: verifies LIBC detection selects the musl
# binary variant from the Anthropic CDN — no generic concept of a libc
# dimension exists in the generator.
#
# macos_package_default stays hand-written: the generator has no macOS-mode
# support (env-selection pool/families are all Linux-container-oriented).
#
# upstream_package_apt_latest stays hand-written: tests that version=latest
# switches to the "latest" apt channel rather than "stable" — a claude-
# specific URL-template nuance (`{feat.version_input==latest?latest:stable}`
# in the repo URL), not something the generic upstream-package handler knows
# about.
#
# upstream_package_keep_repos stays hand-written: exercises the keep_repos
# custom option (repo retention after install), which has no generic
# equivalent.

binary_musl:
  envs: [alpine-current+bash]
  options:
    method: binary
  tests: [binary_musl]

macos_package_default:
  envs: [macos-current+brew]
  modes: [macos]
  setup: |
    brew list --cask claude-code >/dev/null 2>&1 && brew uninstall --cask claude-code || true
    brew list --cask claude-code@latest >/dev/null 2>&1 && brew uninstall --cask claude-code@latest || true
  options:
    method: package
  tests: [macos_package_default]

upstream_package_apt_latest:
  envs: [ubuntu-stable]
  options:
    method: upstream-package
    version: latest
  tests: [upstream_package_apt_latest]

upstream_package_keep_repos:
  envs: [ubuntu-stable, alpine-current+bash, fedora-current+bash]
  options:
    method: upstream-package
    keep_repos: true
  tests: [upstream_package_keep_repos]
