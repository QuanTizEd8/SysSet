defaults:
  options:
    verify_downloads: false  # skip GPG for speed in tests

# Only invalid_method / invalid_if_exists are generated: they fail fast at
# argument parsing with no TeX Live install. Everything else is SUPPRESSED and
# kept hand-written because it is genuinely texlive-specific:
#   - the install-carrying scenarios pin a minimal `scheme` (infraonly/basic) —
#     TeX Live's real default (scheme=small) is a multi-hundred-MB CTAN download,
#     impractical to repeat across the generated matrix;
#   - if_exists uses a real package/pre-install (texlive detects an existing
#     install via `command -v tlmgr` + symlink.skip, so the generic fake stub is
#     never on PATH / never detected);
#   - tlmgr lands at a dynamic {prefix}/YYYY/bin/<platform> path (no static
#     install-location assertion is possible).
generation:
  suppress:
    scenarios:
      - default
      - script_default
      - if_exists_skip
      - if_exists_fail
      - if_exists_reinstall
      - if_exists_update
      - log_file
      - package_default
    checks:
      - default
      - script_default
      - if_exists_skip
      - if_exists_fail
      - if_exists_reinstall
      - if_exists_update
      - log_file
      - package_default

# ── method=script scenarios ───────────────────────────────────────────────────

default:
  envs: [ubuntu-stable]
  modes: [devcontainer, standalone]
  options:
    scheme: infraonly
    packages: ''
  tests: [tlmgr_on_path]

script_custom_prefix:
  envs: [ubuntu-stable]
  modes: [devcontainer, standalone]
  options:
    scheme: infraonly
    packages: ''
    prefix: /opt/texlive-test
  tests: [script_custom_prefix]

script_no_adjustpath:
  envs: [ubuntu-stable]
  modes: [standalone]
  options:
    scheme: infraonly
    packages: ''
    instopt_adjustpath: false
  tests: [script_no_adjustpath]

script_collections:
  envs: [ubuntu-stable]
  modes: [standalone]
  options:
    scheme: full       # ignored when collections is set
    collections: "latex\nfontsrecommended"
    packages: ''
  tests: [script_collections]

script_inline_profile:
  envs: [ubuntu-stable]
  modes: [standalone]
  options:
    profile: |
      selected_scheme scheme-infraonly
      TEXDIR /usr/local/texlive
      instopt_adjustpath 1
      tlpdbopt_install_docfiles 0
      tlpdbopt_install_srcfiles 0
    packages: ''
  tests: [tlmgr_on_path]

if_exists_skip:
  envs: [ubuntu-stable]
  modes: [standalone]
  setup: |
    # Pre-install a minimal TeX Live via package manager as the "existing" install
    retry apt-get install -y --no-install-recommends texlive-latex-base 2>/dev/null || true
  options:
    method: package
    scheme: basic
    if_exists: skip
  tests: [package_default]

if_exists_fail:
  expect_install_failure: true
  envs: [ubuntu-stable]
  modes: [standalone]
  setup: |
    retry apt-get install -y --no-install-recommends texlive-latex-base 2>/dev/null || true
    printf '#!/bin/sh\necho "TeX Live Manager faked"\n' > /usr/local/bin/tlmgr
    chmod +x /usr/local/bin/tlmgr
  options:
    method: package
    scheme: basic
    if_exists: fail
  tests: [if_exists_fail]

# ── method=package scenarios ──────────────────────────────────────────────────

package_default:
  envs: [ubuntu-stable, debian-stable+bash, alpine-current+bash]
  modes: [devcontainer, standalone]
  options:
    method: package
    scheme: basic
    packages: ''
  tests: [package_default]
