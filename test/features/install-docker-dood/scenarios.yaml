# install-docker-dood test matrix.
#
# Standalone scenarios verify the CLI-only install across every supported
# platform and option set (no daemon needed). The devcontainer scenarios verify
# host-socket forwarding, where the feature's static socket mount + entrypoint
# apply; checks run as the non-root remoteUser.

defaults:
  modes: [standalone]

# --- CLI install across platforms (auto method) --------------------------------
# apt / dnf → docker-ce-cli from Docker's repo (upstream-package);
# pacman / apk / zypper → distro CLI package (package).
cli_ubuntu:
  envs: [ubuntu-stable]
  tests: [cli_only]
cli_ubuntu_current:
  envs: [ubuntu-current]
  tests: [cli_only]
cli_debian:
  envs: [debian-stable+bash]
  tests: [cli_only]
cli_debian_current:
  envs: [debian-current+bash]
  tests: [cli_only]
cli_fedora:
  envs: [fedora-current+bash]
  tests: [cli_only]
cli_rocky:
  envs: [rockylinux-current+bash]
  tests: [cli_only]
cli_arch:
  envs: [archlinux-current]
  tests: [cli_only]
cli_alpine:
  envs: [alpine-current+bash]
  tests: [cli_only]
cli_opensuse:
  envs: [opensuse-leap-current+bash]
  tests: [cli_only]

# --- Method / option variations ------------------------------------------------
cli_binary:
  envs: [ubuntu-stable]
  options:
    method: binary
    install_compose_switch: false
  tests: [cli_core]
cli_no_plugins:
  envs: [ubuntu-stable]
  options:
    install_buildx: false
    install_compose: false
    install_compose_switch: false
  tests: [cli_no_plugins]
cli_user:
  envs: [ubuntu-stable+vscode]
  options:
    add_users: vscode
    add_current_user: false
    add_remote_user: false
    add_container_user: false
  tests: [cli_user]

# --- DooD socket forwarding (devcontainer) -------------------------------------
dood_default:
  envs: [ubuntu-stable+vscode]
  modes: [devcontainer]
  devcontainer:
    remoteUser: vscode
  tests: [dood_socket]
dood_debian:
  envs: [debian-stable+vscode]
  modes: [devcontainer]
  devcontainer:
    remoteUser: vscode
  tests: [dood_socket]
