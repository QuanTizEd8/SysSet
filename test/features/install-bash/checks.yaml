bootstrap_pm_collision:
  description: |
    Verifies bash is not removed after install on a system where install.sh
    bootstrapped it via the OS package manager. On Alpine (no pre-installed
    bash), install.sh installs bash via apk and sets _BASH_INSTALLED_BY_PM; the
    feature's __install_finish_post hook clears that tracking variable so the
    cleanup phase does not uninstall the feature-owned bash.
  checks:
    - title: bash is on PATH after cleanup phase
      cmd: command -v bash
    - title: bash is executable
      cmd: test -x "$(command -v bash)"
    - title: bash reports a version
      cmd: bash -c 'bash --version | grep -Eq "^GNU bash"'
set_login_shell:
  description: |
    set_login_shell changes the resolved user's default login shell to bash and
    registers it in /etc/shells, even when bash pre-exists (skip path).
  checks:
    - title: bash is on PATH
      cmd: command -v bash
    - title: bash registered in /etc/shells
      cmd: grep -qx "$(command -v bash)" /etc/shells
    - title: shelluser default shell is bash
      cmd: |-
        bash -c '[ "$(getent passwd shelluser | cut -d: -f7)" = "$(command -v bash)" ]'
bash_shells_registered:
  description: |
    A source system-wide install registers the installed bash in /etc/shells so
    it is eligible as a login shell. The registered path is the real resolved
    binary (${_RESOLVED_PREFIX}/bin/bash), so resolve symlinks before matching to
    stay correct for both default-prefix and custom-prefix (symlink) installs.
  checks:
    - title: installed bash is registered in /etc/shells
      cmd: grep -qx "$(readlink -f "$(command -v bash)")" /etc/shells
