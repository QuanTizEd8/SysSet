bootstrap_pm_collision:
  # Bash-unique: on a system with no pre-installed bash (Alpine), install.sh
  # bootstraps bash via the OS package manager to run the feature, setting
  # _BASH_INSTALLED_BY_PM. The feature's __install_finish_post hook must clear
  # that tracking so the cleanup phase does not uninstall the bash it just
  # installed. No generic rule models a feature that bootstraps its own tool.
  envs: [alpine-current]
  modes: [standalone]
  options:
    method: package
  tests: [bootstrap_pm_collision]

set_login_shell:
  # set_login_shell (bash-specific option) sets the resolved user's login shell
  # to the installed bash via the if_exists=skip path (Debian ships bash), which
  # must still configure users. No generic rule models login-shell assignment.
  envs: [debian-stable]
  modes: [standalone]
  setup: useradd -m -s /bin/sh shelluser
  options:
    set_login_shell: true
    add_users: shelluser
    add_current_user: false
    add_remote_user: false
    add_container_user: false
  tests: [set_login_shell]

if_exists_fail:
  # Bash-specific: the generated if_exists_fail seeds a fake stub bash, but a
  # fake #!/bin/sh stub can't satisfy install.sh's BASH_VERSINFO check, so
  # install.sh bootstraps a real bash and __init_args_post deliberately
  # overrides if_exists=fail -> reinstall (the feature always installs the
  # requested bash over a bootstrap artifact) — the install then succeeds
  # instead of failing. Test the real behavior against Debian's genuine
  # pre-installed bash (no stub): if_exists=fail then aborts as expected.
  expect_install_failure: true
  envs: [debian-stable]
  modes: [standalone]
  options:
    method: auto
    if_exists: fail
  tests: [if_exists_fail]

generation:
  suppress:
    scenarios:
      # bash is unique: the feature's binary IS the check runner's interpreter.
      # Its install scenarios run on a bash-less Alpine env (bash is Essential
      # everywhere else, so an install there just skips). These two variants put
      # bash off the runner's PATH — prefix_discovery=none installs only under
      # the custom prefix with no symlink/export, and the non-root symlink lands
      # in the user's ~/.local/bin, not the runner's PATH — so the bash-based
      # check runner can't even start ("env: can't execute bash"). The
      # custom_prefix_symlink variant (symlink into /usr/local/bin, on PATH) is
      # generated and covers the custom-prefix install; these two are not
      # testable for bash until the check runner is made POSIX-sh.
      - custom_prefix_no_symlink
      - custom_prefix_symlink_nonroot
      # See the hand-written if_exists_fail above: the fake-stub approach can't
      # exercise bash's real if_exists=fail (bootstrap override kicks in).
      - if_exists_fail
    checks:
      # if_exists_fail is replaced by the hand-written group above.
      - if_exists_fail
  augment_tests:
    # A source system-wide install registers the installed bash in /etc/shells.
    # The generator has no /etc/shells concept, so attach the assertion to the
    # generated source scenarios.
    source_default: [bash_shells_registered]
    version_pinned: [bash_shells_registered]
    version_legacy: [bash_shells_registered]
    custom_prefix_symlink: [bash_shells_registered]
