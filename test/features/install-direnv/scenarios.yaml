# Every scenario except source_default, fish_hook, reinstall, and
# version_match_idempotency is now auto-generated from
# features/install-direnv/metadata.yaml (_options.verify.functional,
# _options.version.test_pins, _options.method, _options.prefix, if_exists,
# invalid enum values, log_file) by .dev/lib/proman/test/gen/. See
# test/features/generation.yaml for the generator config, and run
# `proman-test-gen-preview install-direnv` to inspect the generated output.
#
# generation.suppress.scenarios drops the generated source_default: direnv
# 2.37.1's go.mod requires go 1.24, but bare ubuntu-stable's apt golang-go
# is only 1.22 with no toolchain auto-download available in this sandbox
# (confirmed empirically: `make install` fails with "toolchain not
# available"). The hand-written source_default below uses the
# pre-provisioned debian-stable+go env (a manually-installed go 1.24.0)
# instead.
#
# generation.augment_tests appends hand-written check groups (below, in
# checks.yaml) to specific generated scenarios for direnv's
# shell-activation-hook injection (_options.prefix.activation) — a metadata
# concept the generator has no family for. Unlike install-fzf/install-ruff,
# direnv declares no prefix.applies_when restriction, so activation is
# written regardless of install method — but package_default gets a
# narrower check group (direnv_activation_package, no elvish) than
# default/version_pinned's direnv_activation_default: package-installed
# direnv lands outside _RESOLVED_PREFIX (e.g. apt puts it at /usr/bin, not
# /usr/local/bin), and the elvish hook is generated by *executing* the
# binary at the hardcoded _RESOLVED_PREFIX path — which doesn't exist for
# package installs, so that hook is silently never written (confirmed:
# `install.bash: line 3684: /usr/local/bin/direnv: No such file or
# directory`). bash/zsh/fish/tcsh hooks are static printf'd strings so they
# still get written (with the same dangling absolute path, but the
# generator's check only asserts hook *text* exists, which still passes) —
# a real latent bug in the feature (present before this migration; not
# introduced by it), left as-is per product-owner decision. Tracked as a
# known gap rather than fixed here.
#
# fish_hook stays hand-written: needs a real fish binary to verify
# `fish -c "source ..."` succeeds. reinstall stays hand-written: it tests
# replacing a REAL package-manager-installed direnv (env: debian-stable+direnv)
# rather than a fake stub, exercising existing-method detection that the
# generated if_exists_reinstall's stub-based approach doesn't cover.
# version_match_idempotency is a regression test for if_exists=fail firing
# regardless of version match, same pattern as install-yq's.
#
# Dropped as now-generated/superseded: specific_version (-> version_pinned),
# binary_custom_prefix (-> custom_prefix_symlink + direnv_activation_custom_prefix
# augmentation), custom_prefix_no_symlink (-> generated equivalent),
# package_default (-> generated equivalent, now additionally covering
# opensuse/archlinux), if_exists_fail/if_exists_skip (-> generated
# equivalents).
generation:
  suppress:
    scenarios: [source_default]
    # Method scenarios now emit their own outcome-verifying check group, so the
    # generated source_default group must be suppressed too (this feature keeps
    # its hand-written source_default group for the go-toolchain env).
    checks: [source_default]
  augment_tests:
    default: [direnv_activation_default]
    version_pinned: [direnv_activation_default]
    package_default: [direnv_activation_package]
    custom_prefix_symlink: [direnv_activation_custom_prefix]

source_default:
  envs: [debian-stable+go]
  modes: [standalone]
  options:
    method: source
    version: "2.37.1"
  tests: [source_default]

fish_hook:
  envs: [ubuntu-stable+fish]
  modes: [devcontainer, standalone]
  tests: [fish_hook]

reinstall:
  envs: [debian-stable+direnv]
  modes: [devcontainer, standalone]
  options:
    version: "2.37.1"
    method: binary
    if_exists: reinstall
  tests: [reinstall]

version_match_idempotency:
  expect_install_failure: true
  envs: [debian-stable]
  modes: [standalone]
  setup: |
    printf '#!/usr/bin/env bash\nif [ "${1-}" = "--version" ]; then echo "2.37.1"; exit 0; fi\nexit 0' \
      > /usr/local/bin/direnv
    chmod +x /usr/local/bin/direnv
  options:
    version: "2.37.1"
    if_exists: fail
  tests: [version_match_idempotency]
  standalone:
    skip_install: false
