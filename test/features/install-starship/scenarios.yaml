completions_zsh_only:
  envs: [debian-stable]
  modes: [devcontainer]
  options:
    shells: zsh
  tests: [completions_zsh_only]
completions_bash_only:
  envs: [debian-stable]
  modes: [devcontainer]
  options:
    shells: bash
  tests: [completions_bash_only]
no_completions:
  envs: [debian-stable]
  modes: [devcontainer]
  options:
    shells: ""
  tests: [no_completions]
completions_all:
  envs: [ubuntu-stable+fish]
  modes: [devcontainer]
  options:
    shells: "bash\nzsh\nfish"
  tests: [completions_all]
version_match_idempotency:
  expect_install_failure: true
  envs: [debian-stable]
  modes: [standalone]
  setup: |
    printf '#!/usr/bin/env bash\nif [ "${1-}" = "--version" ]; then echo "1.25.1"; exit 0; fi\nexit 0' \
      > /usr/local/bin/starship
    chmod +x /usr/local/bin/starship
  options:
    version: "1.25.1"
    if_exists: fail
  tests: [version_match_idempotency]
  standalone:
    skip_install: false
custom_zsh_rcfile:
  envs: [debian-stable]
  modes: [devcontainer]
  options:
    shells: zsh
    zsh_rcfile: /root/.zshrc
  tests: [custom_zsh_rcfile]
custom_bash_rcfile:
  envs: [debian-stable]
  modes: [devcontainer]
  options:
    shells: bash
    bash_rcfile: /root/.bashrc
  tests: [custom_bash_rcfile]
generation:
  augment_tests:
    default:
      - shells_default_prompt_init
