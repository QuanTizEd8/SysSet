completions_zsh_only:
  envs: [debian-stable]
  modes: [devcontainer]
  options:
    shells: zsh
  tests: [completions_zsh_only]
completions_bash_only:
  envs: [debian-stable]
  modes: [devcontainer]
  options:
    shells: bash
  tests: [completions_bash_only]
no_completions:
  envs: [debian-stable]
  modes: [devcontainer]
  options:
    shells: ""
  tests: [no_completions]
completions_all:
  envs: [ubuntu-stable+fish]
  modes: [devcontainer]
  options:
    shells: "bash\nzsh\nfish"
  tests: [completions_all]
custom_zsh_rcfile:
  envs: [debian-stable]
  modes: [devcontainer]
  options:
    shells: zsh
    zsh_rcfile: /root/.zshrc
  tests: [custom_zsh_rcfile]
custom_bash_rcfile:
  envs: [debian-stable]
  modes: [devcontainer]
  options:
    shells: bash
    bash_rcfile: /root/.bashrc
  tests: [custom_bash_rcfile]
generation:
  augment_tests:
    default:
      - shells_default_prompt_init
