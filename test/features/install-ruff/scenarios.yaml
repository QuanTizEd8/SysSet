# Every scenario is now auto-generated from features/install-ruff/metadata.yaml
# (_options.verify.functional, _options.version.test_pins, _options.method,
# _options.prefix, _options.completions, if_exists, invalid enum values,
# log_file) by .dev/lib/proman/test/gen/. See test/features/generation.yaml
# for the generator config, and run `proman-test-gen-preview install-ruff` to
# inspect the generated output.
#
# generation.augment_tests appends hand-written check groups (below, in
# checks.yaml) to specific generated scenarios for ruff's genuinely
# tool-specific behavior the generator has no concept of: ruff writes a
# cargo-dist self-update receipt (~/.config/ruff/ruff-receipt.json), via its
# own __configure_user hook (metadata's configure_users: true), only for
# binary installs, recording install_prefix and the cargo-dist provider
# version that built the release — package/upstream-package/cargo installs
# must NOT write one. Same pattern as install-uv's uv_receipt_*.
generation:
  augment_tests:
    default: [ruff_receipt_default]
    version_pinned: [ruff_receipt_pinned]
    custom_prefix_symlink: [ruff_receipt_custom_prefix]
    package_default: [ruff_receipt_absent]
    upstream_package_default: [ruff_receipt_absent]
    cargo_default: [ruff_receipt_absent]
