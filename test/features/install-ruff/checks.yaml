# Every check group except the ruff_receipt_* ones below is now auto-generated
# — see scenarios.yaml for how they're wired to specific generated scenarios
# via generation.augment_tests.

ruff_receipt_default:
  description: |
    Default binary install: ruff writes a cargo-dist self-update receipt
    with the default install_prefix and a dynamically-fetched provider
    version.
  checks:
    - title: ruff install receipt exists
      cmd: test -f "${HOME}/.config/ruff/ruff-receipt.json"
      debug: |
        echo "=== ruff-receipt.json ==="
        cat "${HOME}/.config/ruff/ruff-receipt.json" 2> /dev/null || echo "(missing)"
    - title: ruff install receipt reports default install_prefix
      cmd: bash -c 'grep -q "\"install_prefix\":\"/usr/local/bin\"" "${HOME}/.config/ruff/ruff-receipt.json"'
    - title: ruff install receipt has a dynamically-fetched cargo-dist provider version
      cmd: bash -c 'grep -Eq "\"provider\":\{\"source\":\"cargo-dist\",\"version\":\"[0-9]+\.[0-9]+\.[0-9]+\"\}" "${HOME}/.config/ruff/ruff-receipt.json"'

ruff_receipt_pinned:
  description: |
    version=0.15.20: ruff writes a cargo-dist self-update receipt reporting
    exactly that version and the cargo-dist provider version that built it.
  checks:
    - title: ruff install receipt exists
      cmd: test -f "${HOME}/.config/ruff/ruff-receipt.json"
    - title: ruff install receipt reports version 0.15.20
      cmd: bash -c 'grep -q "\"version\":\"0.15.20\"" "${HOME}/.config/ruff/ruff-receipt.json"'
    - title: ruff install receipt reports the exact cargo-dist version that built this release
      cmd: bash -c 'grep -Eq "\"provider\":\{\"source\":\"cargo-dist\",\"version\":\"0.31.0\"\}" "${HOME}/.config/ruff/ruff-receipt.json"'
      debug: |
        echo "=== ruff-receipt.json ==="
        cat "${HOME}/.config/ruff/ruff-receipt.json" 2> /dev/null || echo "(missing)"

ruff_receipt_custom_prefix:
  description: |
    Custom prefix: the receipt reports the custom install_prefix.
  checks:
    - title: ruff install receipt reports the custom install_prefix
      cmd: bash -c 'grep -q "\"install_prefix\":\"/opt/ruff-test/bin\"" "${HOME}/.config/ruff/ruff-receipt.json"'

ruff_receipt_absent:
  description: |
    Non-binary install methods (package, upstream-package, cargo) must not
    write a cargo-dist self-update receipt — that mechanism only applies to
    the binary release ruff itself ships.
  checks:
    - title: ruff install receipt is not written
      cmd: bash -c '! test -e "${HOME}/.config/ruff/ruff-receipt.json"'
