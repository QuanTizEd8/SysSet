functional_search:
  description: |
    The real end-to-end rga -> ripgrep search pipeline. rga shells out to `rg`
    at runtime (provided here by the ubuntu-stable+ripgrep env), so this is the
    coverage the generated, rg-independent `--rga-list-adapters` functional
    smoke test cannot provide.

  checks:
    - title: rg is available at runtime
      cmd: command -v rg
    - title: rga searches a plain-text file end to end
      cmd: bash -c 'echo "hello ripgrep-all" > /tmp/rga-search-test.txt && rga "hello" /tmp/rga-search-test.txt'
    - title: rga reports no match with a non-zero exit for an absent pattern
      cmd: bash -c 'echo "hello" > /tmp/rga-search-test2.txt; ! rga "definitely-not-present" /tmp/rga-search-test2.txt'

package_rg_dep:
  description: |
    Augments the generated package_default: the OS ripgrep-all package must pull
    ripgrep (rg) in as a runtime dependency, so the real search works with no
    separately-installed rg.

  checks:
    - title: rg pulled in as a package dependency
      cmd: command -v rg
    - title: rga search works using the dependency-provided rg
      cmd: bash -c 'echo "hello ripgrep-all" > /tmp/rga-pkg-test.txt && rga "hello" /tmp/rga-pkg-test.txt'

install_adapters:
  description: |
    Verifies the install_adapters option pulls the adapter tool dependencies
    (pandoc, poppler-utils/pdftotext, ffmpeg) and that rga reports the PDF
    adapter as enabled.

  checks:
    - title: rga is on PATH
      cmd: command -v rga
    - title: pandoc is installed
      cmd: command -v pandoc
    - title: pdftotext is installed
      cmd: command -v pdftotext
    - title: ffmpeg is installed
      cmd: command -v ffmpeg
    - title: rga adapter list shows pdf adapter enabled
      cmd: bash -c 'rga --rga-list-adapters | grep -qi "poppler\|pdf"'
