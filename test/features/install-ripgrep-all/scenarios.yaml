# Residue: only scenarios unique to install-ripgrep-all.
# default, package_default, if_exists_{skip,fail}, prefix, version, invalid, and
# log_file are generated. The generated functional smoke test
# (`rga --rga-list-adapters`) is deliberately rg-independent; the two scenarios
# below cover what the generic checks can't:
#   - functional_search: the real rga -> rg search pipeline (needs ripgrep at
#     runtime), on an rg-provisioned env.
#   - install_adapters: the feature's `install_adapters` option.
# The generated package_default is augmented with `package_rg_dep` to assert the
# package method pulls ripgrep in as a runtime dependency.
generation:
  augment_tests:
    package_default: [package_rg_dep]

functional_search:
  envs: [ubuntu-stable+ripgrep]
  modes: [devcontainer, standalone]
  tests: [functional_search]

install_adapters:
  envs: [ubuntu-stable+ripgrep]
  modes: [standalone]
  options:
    install_adapters: true
  tests: [install_adapters]
