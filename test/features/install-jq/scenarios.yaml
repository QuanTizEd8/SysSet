# Every scenario except the one below is now auto-generated from
# features/install-jq/metadata.yaml (_options.verify.functional,
# _options.version.test_pins, _options.method, _options.prefix, if_exists,
# invalid enum values, log_file, completions) by .dev/lib/proman/test/gen/.
# See test/features/generation.yaml for the generator config, and run
# `proman-test-gen-preview install-jq` to inspect the generated output.
#
# generation.suppress.scenarios drops if_exists_reinstall/if_exists_update:
# both seed a fake `jq` stub script on PATH to simulate a pre-existing
# install, but jq is uniquely self-referential — lib/github.bash's own
# version-resolution code calls bootstrap__jq() to parse the GitHub releases
# API response, which finds the fake stub via `command -v jq`, assumes it's a
# real working jq, and skips installing a real one. The fake stub silently
# no-ops for any invocation other than `--version`, so the JSON query returns
# nothing and version resolution fails with a misleading "no release
# matching" error — a jq-specific bootstrap collision (confirmed via a real
# Docker run + reading lib/bootstrap.bash's bootstrap__jq), not a defect in
# the generic if_exists rule, which works correctly for every other feature.
#
# package_manifest_override exercises an inline ospkg_manifest_method_package_run
# override — a manifest-DSL escape hatch orthogonal to jq's own metadata shape,
# not something the generator can derive.
generation:
  suppress:
    scenarios: [if_exists_reinstall, if_exists_update]

package_manifest_override:
  envs: [ubuntu-stable]
  modes: [standalone]
  options:
    method: package
    ospkg_manifest_method_package_run: |
      packages:
        - jq
  tests: [package_manifest_override]
