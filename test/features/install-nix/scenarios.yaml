# install-nix is not in the test-generation pool (it is not a standard prefix
# feature), so every scenario here is hand-authored.
#
# Install modes and how they map to the two Nix modes:
#   • devcontainer mode installs at image-build time as root with a remoteUser,
#     so `multi_user=auto` resolves to SINGLE-user owned by that remote user.
#   • standalone mode runs as root with no remote user, so `multi_user=auto`
#     resolves to MULTI-user; single/multi can also be forced via the option.
#
# Nix's binary tarball is glibc-linked, so install scenarios target glibc
# distros (Alpine/musl is out of scope for v1).

defaults:
  options:
    log_level: debug

# ── Single-user (the container-first default) ─────────────────────────────────
# Installed at build as root; owned by the remote user via auto-resolution.
single_user:
  envs: [ubuntu-stable+vscode]
  modes: [devcontainer]
  devcontainer:
    remoteUser: vscode
  tests: [single_user]

# ── Multi-user ────────────────────────────────────────────────────────────────
multi_user:
  envs: [ubuntu-stable, fedora-current]
  modes: [standalone]
  options:
    multi_user: multi
  tests: [multi_user]

# ── Post-install: packages + nix.conf (enable_flakes, extra_nix_config) ───────
packages:
  envs: [ubuntu-stable]
  modes: [standalone]
  options:
    multi_user: multi
    packages: hello
    enable_flakes: true
    extra_nix_config: "max-jobs = 2"
  tests: [packages]

# ── Post-install: inline declarative manifest ─────────────────────────────────
manifest_inline:
  envs: [ubuntu-stable]
  modes: [standalone]
  options:
    multi_user: multi
    manifest: |
      with import <nixpkgs> { }; [ hello ]
  tests: [manifest_inline]

# ── Alternate installer: the Rust nix-installer (multi-user only) ─────────────
method_nix_installer:
  envs: [ubuntu-stable]
  modes: [standalone]
  options:
    installer: nix-installer
    multi_user: multi
  tests: [method_nix_installer]

# ── if_exists: skip / fail over a pre-existing stub ───────────────────────────
if_exists_skip:
  envs: [ubuntu-stable]
  modes: [standalone]
  options:
    if_exists: skip
    multi_user: multi
  setup: |
    printf '#!/bin/sh\necho "nix-env (Nix) 9.9.9-stub"\n' > /usr/local/bin/nix-env
    chmod +x /usr/local/bin/nix-env
  tests: [if_exists_skip]

if_exists_fail:
  expect_install_failure: true
  envs: [ubuntu-stable]
  modes: [standalone]
  options:
    if_exists: fail
    multi_user: multi
  setup: |
    printf '#!/bin/sh\necho "nix-env (Nix) 9.9.9-stub"\n' > /usr/local/bin/nix-env
    chmod +x /usr/local/bin/nix-env
  tests: [if_exists_fail]

# ── Invalid option combinations (must fail fast, before any install) ──────────
invalid_nix_installer_single:
  expect_install_failure: true
  envs: [ubuntu-stable]
  modes: [standalone]
  options:
    installer: nix-installer
    multi_user: single
  tests: [invalid_nix_installer_single]

# ── macOS (multi-user only; installer manages the APFS volume + launchd) ──────
macos_default:
  envs: [macos-current]
  modes: [macos]
  tests: [macos_default]
