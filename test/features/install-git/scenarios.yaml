package_no_ppa:
  envs:
    - debian-stable
  modes:
    - devcontainer
  options:
    version: stable
  tests:
    - package_no_ppa
package_stable:
  envs:
    - ubuntu-stable
  modes:
    - devcontainer
  options:
    version: stable
    prefix: /opt/git
    export_path: /tmp/install-git-path.sh
    prefix_discovery: none
    shell_completions: ''
  tests:
    - package_stable
gitconfig_system:
  envs:
    - ubuntu-stable
  modes:
    - devcontainer
  options:
    default_branch: trunk
    safe_directory: '*

      /workspaces/devfeats

      /tmp/repo'
    gitconfig: "[push]\n  default = simple\n[fetch]\n  prune = true"
  tests:
    - gitconfig_system
gitconfig_identity:
  envs:
    - ubuntu-stable
  modes:
    - devcontainer
  options:
    user_name: Dev User
    user_email: dev@example.com
  tests:
    - gitconfig_identity
source_installer_dir:
  envs:
    - ubuntu-stable
  modes:
    - devcontainer
  options:
    method: source
    version: stable
    installer_dir: /tmp/git-build-trace
  tests:
    - source_installer_dir
source_export_path_disabled:
  envs:
    - ubuntu-stable
  modes:
    - devcontainer
  options:
    method: source
    version: stable
    prefix: /opt/git
    export_path: ''
    prefix_discovery: none
  tests:
    - source_export_path_disabled
source_no_flags_perl:
  envs:
    - ubuntu-stable
  modes:
    - devcontainer
  options:
    method: source
    version: stable
    no_flags: perl
  tests:
    - source_no_flags_perl
if_exists_reinstall_source:
  envs:
    - ubuntu-stable+git
  modes:
    - devcontainer
  options:
    method: source
    version: stable
    prefix: /opt/git
    if_exists: reinstall
    default_branch: trunk
  tests:
    - if_exists_reinstall_source
if_exists_update_package:
  envs:
    - ubuntu-stable+git
  modes:
    - devcontainer
  options:
    if_exists: update
    version: stable
    default_branch: trunk
  tests:
    - if_exists_update_package
if_exists_fail_preinstalled:
  expect_install_failure: true
  envs:
    - ubuntu-stable+git
  modes:
    - standalone
  options:
    if_exists: fail
  standalone:
    skip_install: false
  tests:
    - if_exists_fail_preinstalled
source_build_network_isolated:
  expect_install_failure: true
  envs:
    - ubuntu-stable
  modes:
    - standalone
  standalone:
    network: none
    skip_install: false
  tests:
    - source_build_network_isolated
  options:
    method: source
    version: latest
source_build_nonexistent_version:
  expect_install_failure: true
  envs:
    - ubuntu-stable
  modes:
    - standalone
  standalone:
    skip_install: false
  tests:
    - source_build_nonexistent_version
  options:
    method: source
    version: 0.0.0
