# Every scenario is now auto-generated from features/install-uv/metadata.yaml
# (_options.verify.functional, _options.version.test_pins, _options.method,
# _options.prefix, _options.completions, if_exists, invalid enum values,
# log_file) by .dev/lib/proman/test/gen/. See test/features/generation.yaml
# for the generator config, and run `proman-test-gen-preview install-uv` to
# inspect the generated output.
#
# generation.augment_tests appends hand-written check groups (below, in
# checks.yaml) to specific generated scenarios for uv's genuinely
# tool-specific behavior the generator has no concept of: uv writes a
# cargo-dist self-update receipt (~/.config/uv/uv-receipt.json) only for
# binary installs, recording install_prefix and the cargo-dist provider
# version that built the release — package/cargo installs must NOT write
# one. uv also ships a second binary (uvx) alongside uv.
generation:
  augment_tests:
    default: [uv_receipt_default]
    version_pinned: [uv_receipt_pinned]
    custom_prefix_symlink: [uv_receipt_custom_prefix]
    package_default: [uv_receipt_absent]
    cargo_default: [uv_receipt_absent]
