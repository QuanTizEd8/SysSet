# Every check group except the uv_receipt_* ones below is now auto-generated
# — see scenarios.yaml for how they're wired to specific generated scenarios
# via generation.augment_tests.

uv_receipt_default:
  description: |
    Default binary install: uvx --version succeeds, and uv writes a
    cargo-dist self-update receipt with the default install_prefix and a
    dynamically-fetched provider version.
  checks:
    - title: uvx --version succeeds
      cmd: uvx --version
    - title: uv install receipt exists
      cmd: test -f "${HOME}/.config/uv/uv-receipt.json"
      debug: |
        echo "=== uv-receipt.json ==="
        cat "${HOME}/.config/uv/uv-receipt.json" 2> /dev/null || echo "(missing)"
    - title: uv install receipt reports default install_prefix
      cmd: bash -c 'grep -q "\"install_prefix\":\"/usr/local/bin\"" "${HOME}/.config/uv/uv-receipt.json"'
    - title: uv install receipt has a dynamically-fetched cargo-dist provider version
      cmd: bash -c 'grep -Eq "\"provider\":\{\"source\":\"cargo-dist\",\"version\":\"[0-9]+\.[0-9]+\.[0-9]+\"\}" "${HOME}/.config/uv/uv-receipt.json"'

uv_receipt_pinned:
  description: |
    version=0.9.7: uv writes a cargo-dist self-update receipt reporting
    exactly that version and the cargo-dist provider version that built it.
  checks:
    - title: uv install receipt exists
      cmd: test -f "${HOME}/.config/uv/uv-receipt.json"
    - title: uv install receipt reports version 0.9.7
      cmd: bash -c 'grep -q "\"version\":\"0.9.7\"" "${HOME}/.config/uv/uv-receipt.json"'
    - title: uv install receipt reports the exact cargo-dist version that built this release
      cmd: bash -c 'grep -Eq "\"provider\":\{\"source\":\"cargo-dist\",\"version\":\"0.30.1\"\}" "${HOME}/.config/uv/uv-receipt.json"'
      debug: |
        echo "=== uv-receipt.json ==="
        cat "${HOME}/.config/uv/uv-receipt.json" 2> /dev/null || echo "(missing)"

uv_receipt_custom_prefix:
  description: |
    Custom prefix: uvx binary and symlink exist alongside uv's, and the
    receipt reports the custom install_prefix.
  checks:
    - title: uvx binary is at /opt/uv-test/bin/uvx
      cmd: test -f /opt/uv-test/bin/uvx
    - title: uvx resolves from PATH
      cmd: command -v uvx
    - title: uv install receipt reports the custom install_prefix
      cmd: bash -c 'grep -q "\"install_prefix\":\"/opt/uv-test/bin\"" "${HOME}/.config/uv/uv-receipt.json"'

uv_receipt_absent:
  description: |
    Non-binary install methods (package, cargo) must not write a
    cargo-dist self-update receipt — that mechanism only applies to the
    binary release uv itself ships.
  checks:
    - title: uv install receipt is not written
      cmd: bash -c '! test -e "${HOME}/.config/uv/uv-receipt.json"'
