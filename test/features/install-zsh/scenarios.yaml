# Most scenarios are auto-generated from features/install-zsh/metadata.yaml
# (_options.verify.functional, _options.version.test_pins, _options.method,
# _options.prefix, if_exists, invalid enum values, log_file) by
# .dev/lib/proman/test/gen/. Run `proman-test-gen-preview install-zsh` to
# inspect the generated output.
#
# The generated version_pinned/source_default/custom_prefix scenarios pin
# method=source (package is dropped for a specific version and is not
# prefix-capable), and the non-root custom-prefix scenario pre-installs zsh's
# build deps (build-essential/libncurses-dev) as root so the su-wrapped source
# build has a toolchain — derived from _dependencies.build.method-source.
#
# Residue: set_login_shell is a zsh-specific configure-user behavior (register
# zsh in /etc/shells and set it as a user's login shell) with no generic
# generator equivalent, so it stays hand-written.
set_login_shell:
  envs: [debian-stable]
  modes: [standalone]
  setup: "useradd -m -s /bin/bash shelluser"
  options:
    method: package
    set_login_shell: true
    add_users: shelluser
    add_current_user: false
    add_remote_user: false
    add_container_user: false
  tests: [set_login_shell]
