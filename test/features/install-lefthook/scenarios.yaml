# Every scenario except installer_dir and macos_package_default is now
# auto-generated from features/install-lefthook/metadata.yaml
# (_options.verify.functional, _options.version.test_pins, _options.method,
# _options.prefix, if_exists, invalid enum values, log_file) by
# .dev/lib/proman/test/gen/. See test/features/generation.yaml for the
# generator config, and run `proman-test-gen-preview install-lefthook` to
# inspect the generated output.
#
# installer_dir exercises the universal INSTALLER_DIR option (verifying the
# downloaded binary/checksums are preserved for debugging) — a
# framework-wide option with no dedicated generator family yet.
# macos_package_default stays hand-written: the generator has no macOS
# support currently (method.package here is brew-only, not testable in the
# Linux-only env pool).
#
# Dropped as now-generated/superseded: binary_custom_prefix declared
# if_exists: reinstall with no setup: seeding a pre-existing install, so
# if_exists was inert — substantively identical to the generated
# custom_prefix_symlink. The hand-written upstream_package_default used
# bare alpine-current (no persistent bash — the feature's own bootstrap bash
# is removed after install, per its `shell: sh` workaround), fully
# superseded by the generated version, which correctly uses
# alpine-current+bash (a permanently-provisioned bash) and additionally
# covers fedora/opensuse — coverage that surfaced two real bugs (a
# fedora/el repo-path templating typo, and a missing ca-certificates base
# dependency for the SSL-verified custom repos), both fixed alongside this
# migration.
