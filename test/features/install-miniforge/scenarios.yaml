# Residue: scenarios unique to install-miniforge, plus generation directives.
# Generated (mechanical): default (+ default_conda_scaffold augment), version_pinned
# (24.7.1), invalid_if_exists, log_file (+ log_file_conda augment), custom_prefix_*
# (+ custom_prefix_conda augment on the symlink one), script_default.
#
# if_exists is SUPPRESSED: miniforge uses bin_dir=condabin (the framework detects
# an existing install at {prefix}/bin/conda and its uninstall runs `conda init
# --reverse` on a real conda), so the generic fake-stub if_exists cannot detect or
# tear down a stub. The hand-written if_exists_* below exercise the real behaviour
# against a genuinely pre-installed conda (ubuntu-stable+miniforge image).
generation:
  suppress:
    scenarios: [if_exists_skip, if_exists_fail, if_exists_reinstall, if_exists_update]
    checks: [if_exists_skip, if_exists_fail, if_exists_reinstall, if_exists_update]
    # conda ships two entrypoints — bin/conda (full) and condabin/conda (the
    # framework-symlinked primary bin). conda's base auto-activation prepends
    # /opt/conda/bin, so in an activated (devcontainer) shell `type -P conda`
    # resolves to bin/conda, not condabin/conda — a valid conda, just a
    # different entrypoint, which the generic exact "on PATH resolves to
    # <condabin>" assertion can't model. The symlink checks already prove the
    # framework's /usr/local/bin/conda -> condabin/conda exposure. (mamba has no
    # such dual entrypoint, so its resolve check stays.)
    check_items: ["conda on PATH resolves to"]
  augment_tests:
    # default_conda_scaffold's checks are all absolute-path (dirs/binaries/
    # `conda info --base`/env list), mode-independent, so they augment the
    # generated `default` install rather than re-installing conda. NOTE:
    # export_path_default/stable_version are NOT folded here — their `login PATH
    # includes /opt/conda/bin` check (`bash -lc`) depends on the login shell
    # sourcing conda's *interactive* activation (`/etc/bash.bashrc`), which only
    # happens in a devcontainer base image; `default` also runs standalone, where
    # a login/non-interactive shell legitimately lacks it. They stay their own
    # devcontainer-only scenarios (below) — a different setup+options+**mode**
    # combination than `default`, so not a true duplicate.
    default: [default_conda_scaffold]
    log_file: [log_file_conda]
    custom_prefix_symlink: [custom_prefix_conda]

# Devcontainer-only: the `login PATH includes /opt/conda/bin` check needs a base
# image whose login shell sources conda's interactive activation. Same options as
# `default`, but devcontainer-only — a distinct setup+options+mode combination, so
# kept separate rather than folded into the both-modes `default`.
export_path_default:
  envs: [ubuntu-stable]
  modes: [devcontainer]
  tests: [export_path_default]

stable_version:
  envs: [ubuntu-stable]
  modes: [devcontainer]
  tests: [stable_version]

set_permission:
  envs: [ubuntu-stable]
  modes: [devcontainer]
  options:
    write_group: conda
  tests: [set_permission]

activate_bashrc:
  envs: [ubuntu-stable]
  modes: [devcontainer]
  options:
    shell_activations: bash
  tests: [activate_bashrc]

activate_multi:
  envs: [ubuntu-stable+zsh]
  modes: [devcontainer]
  options:
    shell_activations: "bash\nzsh"
  tests: [activate_multi]

custom_active_env:
  envs: [ubuntu-stable]
  modes: [devcontainer]
  options:
    shell_activations: bash
    activate_env: myenv
  tests: [custom_active_env]

if_exists_reinstall:
  envs: [ubuntu-stable+miniforge]
  modes: [devcontainer]
  args:
    MINIFORGE_PATH: latest/download
    MINIFORGE_FILENAME: Miniforge3-Linux
  options:
    if_exists: reinstall
  tests: [if_exists_reinstall]

if_exists_skip:
  envs: [ubuntu-stable+miniforge]
  modes: [devcontainer]
  args:
    MINIFORGE_PATH: latest/download
    MINIFORGE_FILENAME: Miniforge3-Linux
  options:
    if_exists: skip
  tests: [if_exists_skip]

if_exists_fail:
  envs: [ubuntu-stable]
  modes: [devcontainer]
  options:
    if_exists: fail
  tests: [if_exists_fail]

if_exists_update:
  envs: [ubuntu-stable]
  modes: [devcontainer]
  options:
    if_exists: update
  tests: [if_exists_update]

debian:
  envs: [debian-stable]
  modes: [devcontainer]
  tests: [debian]

multi_user_permissions:
  envs: [ubuntu-stable]
  modes: [devcontainer]
  setup: |
    useradd -m testuser1
    useradd -m testuser2
  options:
    write_group: conda
    write_users: "testuser1\ntestuser2"
  tests: [multi_user_permissions]

version_match_idempotency:
  envs: [ubuntu-stable+miniforge]
  modes: [devcontainer]
  args:
    MINIFORGE_PATH: download/24.7.1-2
    MINIFORGE_FILENAME: Miniforge3-24.7.1-2-Linux
  options:
    version: "24.7.1"
    if_exists: reinstall
  tests: [version_match_idempotency]

preserve_envs_true:
  envs: [ubuntu-stable+miniforge]
  modes: [devcontainer]
  args:
    MINIFORGE_PATH: download/24.7.1-2
    MINIFORGE_FILENAME: Miniforge3-24.7.1-2-Linux
  setup: /opt/conda/bin/conda create -n myenv --yes
  options:
    if_exists: reinstall
    preserve_envs: true
  tests: [preserve_envs_true]

preserve_envs_false:
  envs: [ubuntu-stable+miniforge]
  modes: [devcontainer]
  args:
    MINIFORGE_PATH: download/24.7.1-2
    MINIFORGE_FILENAME: Miniforge3-24.7.1-2-Linux
  setup: /opt/conda/bin/conda create -n myenv --yes
  options:
    if_exists: reinstall
    preserve_envs: false
  tests: [preserve_envs_false]

preserve_config_true:
  envs: [ubuntu-stable+miniforge]
  modes: [devcontainer]
  args:
    MINIFORGE_PATH: download/24.7.1-2
    MINIFORGE_FILENAME: Miniforge3-24.7.1-2-Linux
  setup: |
    /opt/conda/bin/conda init bash
    echo "auto_activate_base: false" > /root/.condarc
  options:
    if_exists: reinstall
    preserve_config: true
  tests: [preserve_config_true]

preserve_config_false:
  envs: [ubuntu-stable+miniforge]
  modes: [devcontainer]
  args:
    MINIFORGE_PATH: download/24.7.1-2
    MINIFORGE_FILENAME: Miniforge3-24.7.1-2-Linux
  setup: |
    /opt/conda/bin/conda init bash
    echo "auto_activate_base: false" > /root/.condarc
  options:
    if_exists: reinstall
    preserve_config: false
  tests: [preserve_config_false]

if_exists_update_preinstall:
  envs: [ubuntu-stable+miniforge]
  modes: [devcontainer]
  args:
    MINIFORGE_PATH: download/24.7.1-2
    MINIFORGE_FILENAME: Miniforge3-24.7.1-2-Linux
  setup: /opt/conda/bin/conda create -n myenv --yes
  options:
    if_exists: update
  tests: [if_exists_update_preinstall]

symlink_user_home_prefix:
  envs: [ubuntu-stable]
  modes: [devcontainer]
  options:
    prefix: /root/myforge
    prefix_discovery: symlink
  tests: [symlink_user_home_prefix]

github_api_unreachable_network_isolated:
  expect_install_failure: true
  envs: [ubuntu-stable]
  modes: [standalone]
  standalone:
    network: none
    skip_install: false
  tests: [github_api_unreachable_network_isolated]

invalid_version:
  expect_install_failure: true
  envs: [ubuntu-stable]
  modes: [standalone]
  options:
    version: "0.0.0"
  standalone:
    skip_install: false
  tests: [invalid_version]
