fzf_activation_default:
  description: |
    method=binary at the default prefix: shell integration hooks are
    injected into system-wide rc files, invoking fzf via its resolved
    absolute path (see features/install-fzf/install.bash's
    __prefix_activation_snippet).
  checks:
    - title: fzf bash hook written to system rc
      cmd: >-
        bash -c 'grep -q "fzf.*--bash" /etc/bash.bashrc 2>/dev/null
        || grep -q "fzf.*--bash" /etc/bashrc 2>/dev/null
        || grep -q "fzf.*--bash" /etc/bash/bashrc 2>/dev/null'
    - title: fzf zsh hook written to system rc
      cmd: >-
        bash -c 'grep -q "fzf.*--zsh" /etc/zsh/zshrc 2>/dev/null
        || grep -q "fzf.*--zsh" /etc/zshrc 2>/dev/null'
    - title: fzf fish hook written to system conf.d
      cmd: >-
        grep -q "fzf.*--fish"
        /etc/fish/conf.d/${_FEAT_ACTIVATION_PROFILE_D_FILE%.sh}.fish

fzf_activation_custom_prefix:
  description: |
    prefix=/opt/fzf-test, prefix_discovery=symlink: shell integration hooks
    invoke fzf via its resolved custom-prefix absolute path, not the
    default-prefix or PATH-resolved location.
  checks:
    - title: fzf bash hook written to system rc
      cmd: >-
        bash -c 'grep -q "fzf.*--bash" /etc/bash.bashrc 2>/dev/null
        || grep -q "fzf.*--bash" /etc/bashrc 2>/dev/null
        || grep -q "fzf.*--bash" /etc/bash/bashrc 2>/dev/null'
    - title: bash hook uses custom-prefix binary path
      cmd: >-
        bash -c 'grep -qF "/opt/fzf-test/bin/fzf" /etc/bash.bashrc 2>/dev/null
        || grep -qF "/opt/fzf-test/bin/fzf" /etc/bashrc 2>/dev/null
        || grep -qF "/opt/fzf-test/bin/fzf" /etc/bash/bashrc 2>/dev/null'

fish_hook:
  description: |
    With fish installed, verifies the fzf hook is written to the system fish
    conf.d directory and fish can source the file without errors.
  checks:
    - title: fish is available
      cmd: command -v fish
    - title: fzf binary installed
      cmd: test -x /usr/local/bin/fzf
    - title: fzf fish hook written to system conf.d
      cmd: >-
        grep -q "fzf.*--fish"
        /etc/fish/conf.d/${_FEAT_ACTIVATION_PROFILE_D_FILE%.sh}.fish
    - title: fish conf.d file is valid fish syntax
      cmd: fish -c "source /etc/fish/conf.d/${_FEAT_ACTIVATION_PROFILE_D_FILE%.sh}.fish"
    - title: fzf --fish produces output
      cmd: bash -c '/usr/local/bin/fzf --fish | grep -q .'

version_match_idempotency:
  description: |
    version=0.72.0 + if_exists=fail with a stub already claiming version 0.72.0:
    if_exists=fail aborts whenever fzf is found, regardless of version match.
    The stub must remain untouched.
  checks:
    - kind: install_failure
      title: if_exists=fail exits with already-installed error
      pattern: failing (if_exists=fail)
    - title: fzf stub still present
      cmd: command -v fzf
    - title: stub version is still 0.72.0
      cmd: bash -c 'fzf --version 2>/dev/null | grep -q "^0\.72\.0"'
