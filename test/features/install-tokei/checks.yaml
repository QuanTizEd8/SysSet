# All generic check groups are auto-generated — see scenarios.yaml.
#
# Only the tokei-specific residue remains: the full-serialization/JSON-output
# capability of tokei's binary and cargo builds. Appended to version_pinned and
# cargo_default via scenarios.yaml's generation.augment_tests.
tokei_full_features:
  description: |
    tokei's binary and cargo (`--features all`) builds are compiled with full
    serialization support (json/cbor/yaml) and can emit machine-readable JSON —
    capabilities distro packages typically omit, so this is asserted only for
    the full-feature-build scenarios.
  checks:
    - title: tokei is compiled with full serialization support
      cmd: bash -c 'tokei --version 2>/dev/null | grep -q "json, cbor, yaml"'
    - title: tokei emits valid JSON output
      cmd: >-
        bash -c 'd=$(mktemp -d) && printf "#!/bin/sh\necho hello\n" > "$d/f.sh"
        && tokei --output json "$d" | grep -q "Total"; rc=$?; rm -rf "$d"; exit $rc'
