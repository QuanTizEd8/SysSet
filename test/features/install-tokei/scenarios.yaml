# Every scenario is now auto-generated from features/install-tokei/metadata.yaml
# (_options.verify.functional, _options.version.test_pins, _options.method,
# _options.prefix, if_exists, invalid enum values, log_file) by
# .dev/lib/proman/test/gen/. See test/features/generation.yaml for the
# generator config, and run `proman-test-gen-preview install-tokei` to inspect
# the generated output.
#
# The generated version_pinned (12.1.2) exercises the version-gated `binary`
# method (prebuilt assets exist only up to 12.1.2; the resolver drops binary
# above that), and package/upstream_package/cargo defaults cover the rest
# across distros (one scenario per package manager).
#
# Residue: tokei's binary and cargo (`--features all`) builds ship with full
# serialization support (json/cbor/yaml) and can emit JSON — a tokei-specific
# capability distro packages omit, which the generic generator can't derive.
# Kept as the hand-authored tokei_full_features group and appended only to the
# full-feature-build scenarios (mirrors the prior hand-written coverage, which
# asserted it for binary_pinned_version and method_cargo but not the PM
# defaults).
generation:
  augment_tests:
    version_pinned: [tokei_full_features]
    cargo_default: [tokei_full_features]
