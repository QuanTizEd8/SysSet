# Every scenario except the ones below is now auto-generated from
# features/install-codex/metadata.yaml (_options.verify.functional,
# _options.version.test_pins, _options.method, _options.prefix, if_exists,
# invalid enum values, log_file) by .dev/lib/proman/test/gen/. See
# test/features/generation.yaml for the generator config, and run
# `proman-test-gen-preview install-codex` to inspect the generated output.
#
# npm_system stays hand-written: it asserts codex is registered with `npm
# list -g`, not just that the binary works — method_matrix's generic `npm`
# handler only reuses the `default` check group verbatim (existence +
# version + functional), since for most methods the observable result is
# identical regardless of install mechanism. Here it genuinely isn't: the
# generated npm_default wouldn't catch a codex install that works but never
# actually registered with npm. Also runs in devcontainer mode, complementing
# (not duplicating) the generated npm_default, which is standalone-only per
# generation.yaml's method_matrix family config.
#
# auto_binary_npm_present stays hand-written: it's a narrow regression test
# for a specific auto-resolution *priority* invariant (binary wins over npm
# even when npm is present) with no generic equivalent — the generated
# `default` only exercises whatever auto picks on ubuntu-stable (no npm), not
# this specific "npm present but not chosen" scenario.

npm_system:
  envs: [ubuntu-stable+node]
  modes: [devcontainer]
  options:
    method: npm
  tests: [npm_system]

auto_binary_npm_present:
  envs: [ubuntu-stable+node]
  modes: [devcontainer]
  options:
    method: auto
  tests: [auto_binary_npm_present]
