npm_system:
  description: |
    method=npm with system Node.js (pre-installed via setup): installs codex
    via system npm.  Verifies the binary is on PATH, reports a semver, and the
    @openai/codex package is registered in npm's global tree at the feature
    prefix (the template runs `npm install -g --prefix ${_RESOLVED_PREFIX}`, so
    the package lives under /usr/local/lib/node_modules, not npm's default
    /usr/lib prefix).
  pre: |
    echo "=== which codex ==="
    which codex 2>&1 || echo "(not on PATH)"
    echo "=== codex --version ==="
    codex --version 2>&1 || echo "(failed)"
    echo "=== npm list -g @openai/codex --prefix /usr/local ==="
    npm list -g @openai/codex --prefix /usr/local 2>&1 || echo "(not listed)"
    echo "=== /usr/local/lib/node_modules/@openai ==="
    ls -la /usr/local/lib/node_modules/@openai 2>&1 || echo "(missing)"
  checks:
    - title: codex is on PATH
      cmd: command -v codex
    - title: codex --version succeeds
      cmd: codex --version
    - title: codex --version reports a semver
      cmd: bash -c 'codex --version 2>&1 | grep -Eq "(^|[^0-9A-Za-z.])[0-9]+\.[0-9]+(\.[0-9]+)?([^0-9.]|$)"'
      on_fail: |
        echo "=== actual codex --version output ==="
        codex --version 2>&1 || echo "(failed)"
    - title: "@openai/codex registered in npm global at the feature prefix"
      cmd: bash -c 'npm list -g @openai/codex --prefix /usr/local 2>/dev/null | grep -q "@openai/codex" || test -d /usr/local/lib/node_modules/@openai/codex'
      on_fail: |
        npm list -g --prefix /usr/local 2>/dev/null | grep -i codex || echo "(codex not in npm global at /usr/local)"
        ls -la /usr/local/lib/node_modules/@openai 2>&1 || echo "(no @openai scope dir)"

auto_binary_npm_present:
  description: |
    method=auto on amd64 with npm pre-installed: __resolve_method selects binary
    because binary's when: condition (plat.machine_release: [amd64, arm64]) is satisfied.  npm
    is present but not chosen — verifies binary takes priority over npm.
  pre: |
    echo "=== which codex ==="
    which codex 2>&1 || echo "(not on PATH)"
    echo "=== codex --version ==="
    codex --version 2>&1 || echo "(failed)"
    echo "=== file $(command -v codex 2>/dev/null || echo /dev/null) ==="
    file "$(command -v codex)" 2>/dev/null || echo "(not found)"
  checks:
    - title: codex is on PATH
      cmd: command -v codex
    - title: codex --version succeeds
      cmd: codex --version
    - title: codex --version reports a semver
      cmd: bash -c 'codex --version 2>&1 | grep -Eq "(^|[^0-9A-Za-z.])[0-9]+\.[0-9]+(\.[0-9]+)?([^0-9.]|$)"'
    - title: codex installed as a binary (not via npm global — binary method was selected)
      cmd: test -f /usr/local/bin/codex
      on_fail: |
        echo "=== which codex ==="
        which codex 2>&1 || echo "(not on PATH)"
        echo "=== npm list -g ==="
        npm list -g 2>/dev/null | head -5 || echo "(npm not available)"
