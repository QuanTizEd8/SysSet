# Every scenario except version_match_idempotency is now auto-generated from
# features/install-yq/metadata.yaml (_options.verify.functional,
# _options.version.test_pins, _options.method, _options.prefix,
# _options.completions, if_exists, invalid enum values, log_file) by
# .dev/lib/proman/test/gen/. See test/features/generation.yaml for the
# generator config, and run `proman-test-gen-preview install-yq` to inspect
# the generated output.
#
# version_match_idempotency is a genuine regression test with no generic
# equivalent: it verifies if_exists=fail always aborts when yq is already
# installed, even when the *requested* version exactly matches the
# *already-installed* version — i.e. version-match does not exempt
# if_exists=fail from failing (only skip/update do). This needs a real
# yq 4.44.2 pre-installed via a Dockerfile layer (ubuntu-stable+yq-4.44.2),
# not the generic if_exists_fail rule's fake stub (which always uses an
# obviously-different fake version and so never exercises this exact-match
# edge case).
# Dropped as now-generated/superseded: binary_custom_prefix declared
# if_exists: reinstall with no setup: seeding a pre-existing install, so
# if_exists was inert — substantively identical to the generated
# custom_prefix_symlink. package_default (options: {method: auto} on
# debian-stable/apt, where the package method is explicitly unavailable per
# metadata) never actually exercised method=package at all — it tested
# auto-resolution landing on binary on a non-package-compatible distro,
# fully superseded by the generated default/binary_default plus the new
# proper package_default (which correctly covers apk/dnf/zypper/pacman,
# distros where the package method actually applies).
