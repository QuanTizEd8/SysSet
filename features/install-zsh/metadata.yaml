version: 0.1.0
name: Zsh Installation
description: Install [Zsh](https://www.zsh.org/) via the OS package manager or build from an official source tarball.
keywords:
- zsh
- shell
_long_description: >-
  Installs the Zsh shell from the OS native package manager or compiles a release
  tarball from [zsh.org](https://www.zsh.org/pub/). Supports version pinning,
  system-wide installs under `/usr/local`, and user-scoped installs under
  `${HOME}/.local` when building from source. Optionally sets Zsh as the default
  login shell (via `chsh`) for the resolved users.
options:
  set_login_shell:
    type: boolean
    default: true
    description: >-
      Set the default login shell to the installed Zsh (via `chsh`) for the
      resolved users (`add_current_user`, `add_remote_user`, `add_container_user`,
      `add_users`). If both `install-bash` and `install-zsh` set this, the feature
      that runs last in `devcontainer.json` order wins.
_options:
  configure_users: true
  verify:
    args: "--version"
    description: Verify zsh is installed and working.
    functional:
      description: zsh executes a command and returns its output
      cmd: 'test "$({bin} -c "print -rn ok")" = ok'
  version:
    resolution: sidecar
    test_pins:
      pinned: ["5.9.1"]
    # zsh keeps only the current release under pub/ and moves older releases to
    # pub/old/. Resolve stable/latest from pub/, then fall back to the pub/old/
    # listing so an explicitly pinned older version (e.g. 5.9.1) still resolves.
    uri: "https://www.zsh.org/pub/"
    fallback_uri: "https://www.zsh.org/pub/old/"
    pattern: "zsh-[version].tar.xz"
  method:
    package:
      registers_as: zsh
    source:
      asset_uri: "https://www.zsh.org/pub/zsh-{feat.version}.tar.xz"
      fallback_asset_uri: "https://www.zsh.org/pub/old/zsh-{feat.version}.tar.xz"
      # Verify via GPG rather than a checksum sidecar: pub/SHA256SUM only lists
      # the current release, so checksums for older versions are unavailable —
      # but every tarball (in pub/ and pub/old/) ships a detached .asc signed by
      # a key in pub/zsh-keyring.asc. The signature auto-derives as {asset}.asc.
      gpg_key_uri: "https://www.zsh.org/pub/zsh-keyring.asc"
      build_system: autotools
      configure_args:
        - "--with-term-lib=ncursesw ncurses curses termcap"
        - "--enable-multibyte"
        - "--enable-function-subdirs"
        - "--with-tcsetpgrp"
      make_targets:
        - "install.bin"
        - "install.modules"
        - "install.fns"
  prefix:
    bins: [zsh]
    applies_when:
      - method: [source]
_dependencies:
  run:
    method-package:
      packages:
        - name: zsh
          version: "{feat.pm_version}"
  build:
    method-source:
      apt:
        packages:
          - build-essential
          - libncurses-dev
      brew:
        packages:
          - make
          - ncurses
      dnf:
        packages:
          - gcc
          - make
          - ncurses-devel
      apk:
        packages:
          - build-base
          - ncurses-dev
      zypper:
        packages:
          - gcc
          - make
          - ncurses-devel
      pacman:
        packages:
          - base-devel
          - ncurses
