version: 0.1.0
name: Bash Completion Installation
description: Install [bash-completion](https://github.com/scop/bash-completion) v2 and activate it for interactive Bash sessions.
keywords:
- bash
- completion
- shell
_long_description: |-
  Installs [bash-completion](https://github.com/scop/bash-completion) v2 via the
  system package manager (the `bash-completion` package on every major
  distribution; the `bash-completion@2` formula on Homebrew). On Linux no
  activation step is needed: the package's `/etc/profile.d/bash_completion.sh`
  entry point covers login shells, and setup-shell's system bashrc completion
  block covers interactive non-login shells (devcontainers, VS Code terminals).
  On Homebrew — where `/etc/profile.d` is not sourced — a guarded source line for
  `$(brew --prefix)/etc/profile.d/bash_completion.sh` is written to each
  configured user's `~/.bashrc` as a managed block. bash-completion v2 requires
  Bash >= 4.2; on macOS install a modern Bash first (see `install-bash`) — the
  system Bash 3.2 is incompatible.
options: {}
_options:
  configure_users: true
  method:
    package: {}
installsAfter:
  - ghcr.io/quantized8/devfeats/install-bash
  - ghcr.io/quantized8/devfeats/setup-shell
_dependencies:
  run:
    method-package:
      packages:
        - name: bash-completion
          brew: bash-completion@2
