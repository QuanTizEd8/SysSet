version: 0.1.0
name: Typst Installation
description: Install [typst](https://typst.app/) — a markup-based typesetting compiler.
keywords:
  - typst
  - typesetting
  - pdf
  - document
  - cli
_long_description: |-
  Installs the `typst` compiler with configurable installation methods:
  GitHub release assets, Homebrew, and Cargo-based installation.
_options:
  verify:
    args: "--version"
    description: Verify typst is installed and working.
    functional:
      description: typst compiles markup to PDF
      cmd: 'test "$(echo "hello world" | {bin} compile - - | wc -c)" -gt 100'
  gh_repo: typst/typst
  version:
    resolution: github_release
    test_pins:
      pinned: ["0.14.2"]
  method:
    binary:
      asset_uri: "https://github.com/${{ _options.gh_repo }}$/releases/download/{feat.tag}/typst-{plat.machine_release==armv7?armv7-unknown-linux-musleabi:{plat.rust_triple}}.tar.xz"
      binary_src:
        - typst
      when: {plat.machine_release: [amd64, arm64, armv7]}
    package:
      when: {plat.pm: brew}
    cargo:
      crate: typst-cli
      args: ["--locked"]
  prefix:
    bins: [typst]
    applies_when:
      - method: [binary, cargo]
  # typst's binary release is a .tar.xz archive; extracting it requires xz,
  # which — unlike jq/yq — has no privilege-free bootstrap path (see
  # generation.suppress.scenarios in test/features/install-typst/scenarios.yaml).
  completions:
    shells: [bash, zsh, fish]
    subcmd: "completions"
customizations:
  vscode:
    extensions:
      - myriad-dreamin.tinymist
_dependencies:
  run:
    method-package:
      packages:
        - name: typst
          version: "{feat.pm_version}"
  build:
    method-cargo:
      # typst-cli's dependency tree builds openssl-sys, which needs a C
      # toolchain, pkg-config, and the OpenSSL development headers. Without
      # them `cargo install typst-cli` fails at the openssl-sys build step
      # ("failed to run custom build command for openssl-sys").
      packages:
        - make
        - name: gcc
          apt: build-essential
          apk: build-base
        - name: pkg-config
          apk: pkgconf
          dnf: pkgconf-pkg-config
          yum: pkgconf-pkg-config
          pacman: pkgconf
        - name: libssl-dev
          apk: openssl-dev
          dnf: openssl-devel
          yum: openssl-devel
          zypper: libopenssl-devel
          pacman: openssl
          brew: openssl@3
