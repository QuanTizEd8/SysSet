version: 0.1.0
name: Zsh Completions Installation
description: Install [zsh-completions](https://github.com/zsh-users/zsh-completions) and wire up the completion `fpath`.
keywords:
- zsh
- completion
- shell
_long_description: |-
  Installs [zsh-completions](https://github.com/zsh-users/zsh-completions) — extra
  completion definitions not yet merged into the Zsh core — by shallow-cloning the
  repository (the project's canonical install method) into a privilege-appropriate
  prefix, and prepends its `src/` directory to the completion `fpath` via a managed
  block in a hook file sourced before `compinit`. The hook file defaults to
  setup-shell's `sys_shellcompletions` path, so the two features connect with zero
  configuration; use `rcfile` to target other file(s). Pin a release with `version`
  (a git tag such as `0.36.0`); the default `master` follows upstream's recommended
  install. Zsh picks up the new completions on the next `compinit` run (setup-shell's
  system zshrc calls `compinit` on every interactive shell start).
options:
  rcfile:
    type: array
    default: ''
    description: |-
      Space/newline-separated hook file path(s) that receive the managed `fpath`
      block (each must be sourced before `compinit`). Leave empty to use
      setup-shell's default `sys_shellcompletions` path
      (`$(shell__detect_zshdir)/shellcompletions`, resolved at run time). If you
      customize setup-shell's `sys_shellcompletions`, set a matching value here —
      the two are not propagated automatically. For unprivileged installs, point
      this at a user-writable file (e.g. sourced from your `~/.zshrc`).
_options:
  gh_repo: zsh-users/zsh-completions
  version:
    resolution: git_ref
    default: master
  method:
    git-clone:
      uri: "https://github.com/zsh-users/zsh-completions"
  prefix:
    root: /usr/local/share/zsh-completions
    nonroot: "${HOME}/.local/share/zsh-completions"
    symlink:
      skip: true
    exports:
      skip: true
_dependencies:
  run:
    base:
      packages:
        - git
