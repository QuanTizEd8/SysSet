version: 0.1.0
name: ShellCheck Installation
description: Install [ShellCheck](https://github.com/koalaman/shellcheck) — a static analysis tool for shell scripts.
keywords:
  - shellcheck
  - shell
  - lint
  - static-analysis
  - bash
  - cli
_long_description: |-
  Installs ShellCheck, the static analysis tool for shell scripts.

  Note: upstream releases do not provide an ARM64 macOS binary; on Apple
  Silicon `method=binary` is unavailable and `method=auto` falls back to
  the package manager automatically.
_tool_name: ShellCheck
_options:
  verify:
    args: "--version"
    description: Verify shellcheck is installed and working.
    functional:
      description: shellcheck lints a valid script
      cmd: 'printf "#!/bin/sh\necho hi\n" | {bin} -'
  gh_repo: koalaman/shellcheck
  version:
    resolution: github_release
  method:
    binary:
      asset_uri: "https://github.com/${{ _options.gh_repo }}$/releases/download/{feat.tag}/shellcheck-v{feat.version}.{plat.kernel:lower}.{plat.machine}.tar.xz"
      binary_src:
        - shellcheck
      when:
        - {plat.kernel: linux, plat.machine_release: amd64}
        - {plat.kernel: linux, plat.machine_release: arm64}
        - {plat.kernel: darwin, plat.machine_release: amd64}
    package: {}
  prefix:
    bins: [shellcheck]
    applies_when:
      - method: [binary]
customizations:
  vscode:
    extensions:
      - timonwong.shellcheck  # https://github.com/vscode-shellcheck/vscode-shellcheck
      - mads-hartmann.bash-ide-vscode
_dependencies:
  run:
    method-package:
      packages:
        - name: shellcheck
          zypper: ShellCheck
          version: "{feat.pm_version}"
# installsAfter: []
