version: 0.1.0
name: Lefthook Installation
description: Install [Lefthook](https://lefthook.dev/) — a fast, polyglot Git hooks manager.
keywords:
  - lefthook
  - git
  - hooks
  - git-hooks
  - cli
_long_description: |-
  Installs Lefthook, a fast Git hooks manager implemented as a single Go binary.
  Lefthook installs small hook entrypoint scripts into `.git/hooks/` and executes
  jobs defined in `lefthook.yml`, providing a polyglot alternative to
  language-specific hook managers such as Husky.
_tool_name: Lefthook
_options:
  verify:
    args: "version"
    description: Verify lefthook is installed and working.
  gh_repo: evilmartians/lefthook
  version:
    resolution: github_release
    flag: "version"
  method:
    binary:
      asset_uri: "https://github.com/${{ _options.gh_repo }}$/releases/download/{feat.tag}/lefthook_{feat.version}_{plat.kernel==linux?Linux:MacOS}_{plat.machine_gnu}"
      sidecar_uri: "https://github.com/${{ _options.gh_repo }}$/releases/download/{feat.tag}/lefthook_checksums.txt"
      when:
        - {plat.kernel: linux, plat.machine_release: amd64}
        - {plat.kernel: linux, plat.machine_release: arm64}
        - {plat.kernel: darwin, plat.machine_release: amd64}
        - {plat.kernel: darwin, plat.machine_release: arm64}
    npm:
      package: "lefthook"
      args:
        - "--ignore-scripts"
    package:
      when: {plat.pm: brew}
    upstream-package:
      when: {plat.pm: [apt, apk, dnf, yum, zypper]}
  prefix:
    bins: [lefthook]
    applies_when:
      - method: [binary, npm]
_dependencies:
  run:
    method-package:
      brew:
        packages:
          - lefthook
    method-upstream-package:
      packages:
        - name: lefthook
          version: "{feat.pm_version}"
          when:
            plat.pm: [apt, apk, dnf, yum, zypper]
      apt:
        keys:
          - url: "https://dl.cloudsmith.io/public/evilmartians/lefthook/gpg.A05F5DDE3A0BB1D2.key"
            dest: "/usr/share/keyrings/evilmartians-lefthook-archive-keyring.gpg"
        repos:
          - "deb [signed-by=/usr/share/keyrings/evilmartians-lefthook-archive-keyring.gpg] https://dl.cloudsmith.io/public/evilmartians/lefthook/deb/{os.id} {os.version_codename} main"
      apk:
        keys:
          - url: "https://dl.cloudsmith.io/public/evilmartians/lefthook/rsa.CCA91DF99AD351FF.key"
            dest: "/etc/apk/keys/lefthook@evilmartians-CCA91DF99AD351FF.rsa.pub"
            dearmor: false
        repos:
          - "https://dl.cloudsmith.io/public/evilmartians/lefthook/alpine/v{os.version_id_mm}/main"
      dnf:
        repos:
          - |
            [evilmartians-lefthook]
            name=evilmartians-lefthook
            baseurl=https://dl.cloudsmith.io/public/evilmartians/lefthook/rpm/{id==fedora?fedora:el}/{id==fedora?{os.version_id}:{os.version_id_major}}/$basearch
            repo_gpgcheck=1
            enabled=1
            skip_if_unavailable=1
            gpgkey=https://dl.cloudsmith.io/public/evilmartians/lefthook/gpg.A05F5DDE3A0BB1D2.key
            gpgcheck=1
            sslverify=1
            sslcacert=/etc/pki/tls/certs/ca-bundle.crt
            metadata_expire=300
            type=rpm-md
      yum:
        repos:
          - |
            [evilmartians-lefthook]
            name=evilmartians-lefthook
            baseurl=https://dl.cloudsmith.io/public/evilmartians/lefthook/rpm/el/{os.version_id_major}/$basearch
            repo_gpgcheck=1
            enabled=1
            skip_if_unavailable=1
            gpgkey=https://dl.cloudsmith.io/public/evilmartians/lefthook/gpg.A05F5DDE3A0BB1D2.key
            gpgcheck=1
            sslverify=1
            sslcacert=/etc/pki/tls/certs/ca-bundle.crt
            metadata_expire=300
            type=rpm-md
      zypper:
        repos:
          - |
            [evilmartians-lefthook]
            name=evilmartians-lefthook
            baseurl=https://dl.cloudsmith.io/public/evilmartians/lefthook/rpm/opensuse/{os.version_id}/$basearch
            repo_gpgcheck=1
            enabled=1
            skip_if_unavailable=1
            gpgkey=https://dl.cloudsmith.io/public/evilmartians/lefthook/gpg.A05F5DDE3A0BB1D2.key
            gpgcheck=1
            sslverify=1
            sslcacert=/etc/pki/tls/certs/ca-bundle.crt
            metadata_expire=300
            type=rpm-md
# installsAfter: []
