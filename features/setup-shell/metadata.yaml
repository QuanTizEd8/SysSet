    default_path: /etc/skel/.bashrc
    when: _ss_target_skel_bash
    blocks: [user-bashrc-interactive-guard, user-bashrc-bashtheme, user-bashrc-shellrc]
  - id: skel_zshenv
    lifecycle_scope: skel
    default_path: /etc/skel/.zshenv
    when: _ss_target_skel_zsh
