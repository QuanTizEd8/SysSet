version: 0.1.0
name: Shell Setup
description: Configure system-wide and per-user shell environment files for Bash and Zsh.
keywords:
- shell
- zsh
- bash
- config
_long_description: >-
  Deploys a layered set of system-wide and per-user configuration files to ensure
  correct shell behavior across all invocation modes — login, interactive,
  non-interactive, scripts, cron, devcontainer exec, CI runners, and VS Code tasks.
  Deploys shared shell files (`/etc/shellenv`, `/etc/shellrc`, `/etc/shellaliases`,
  `/etc/profile`) and shell-specific system configs (bashrc, bashenv, zshenv,
  zprofile, zshrc), copies per-user dotfiles, and injects `ZDOTDIR` into each user's
  `~/.zshenv`. Install shells separately with `install-bash` / `install-zsh`. Use
  `setup_bash` and `setup_zsh` to control which shell-specific files are deployed.
  Per-scope lifecycle is controlled by `if_exists_sys`, `if_exists_skel`, and
  `if_exists_user`; individual config sections are toggled by `block_*` options.
options:
  setup_bash:
    type: string
    default: auto
    description: |-
      Whether to deploy Bash-specific system and per-user configuration files
      (`/etc/bash.bashrc`, `bashenv`, `BASH_ENV`, user `.bashrc`, etc.).
    enum:
    - value: auto
      description: Deploy when `bash` is on PATH.
    - value: 'true'
      description: Always deploy Bash configuration, even when `bash` is not installed yet.
    - value: 'false'
      description: Skip Bash-specific configuration.
  setup_zsh:
    type: string
    default: auto
    description: |-
      Whether to deploy Zsh-specific system and per-user configuration files
      (`/etc/zsh/*`, user `.zshenv`, `ZDOTDIR`, `.zshrc`, etc.).
    enum:
    - value: auto
      description: Deploy when `zsh` is on PATH.
    - value: 'true'
      description: Always deploy Zsh configuration, even when `zsh` is not installed yet.
    - value: 'false'
      description: Skip Zsh-specific configuration.
  setup_system:
    type: string
    default: auto
    description: |-
      Whether to deploy the live system-wide configuration files (`/etc/shellenv`,
      `/etc/shellrc`, `/etc/profile`, the system bashrc/zsh files, and the
      `BASH_ENV` line). `/etc/skel` templates are governed solely by `setup_skel`.
    enum:
    - value: auto
      description: Deploy when the current process has root privileges or passwordless sudo.
    - value: 'true'
      description: Always deploy system-wide files (fails if insufficient privilege).
    - value: 'false'
      description: Never deploy live system-wide files (skel deployment is still controlled by `setup_skel`).
  setup_skel:
    type: string
    default: auto
    description: |-
      Whether to deploy skel files to `/etc/skel` so new users automatically inherit
      the shell configuration.
    enum:
    - value: auto
      description: Deploy when privileged and `/etc/skel` already exists on the system.
    - value: 'true'
      description: Always deploy to `/etc/skel`, creating the directory if needed.
    - value: 'false'
      description: Never deploy to `/etc/skel`.
  setup_bash_env:
    type: string
    default: auto
    description: Whether to set `BASH_ENV` in `/etc/environment` for non-interactive Bash sessions.
    enum:
    - value: auto
      description: Set `BASH_ENV` when Bash configuration is deployed (`setup_bash` is `auto` or `true`).
    - value: 'true'
      description: Always set `BASH_ENV` (even when `setup_bash` is `false`).
    - value: 'false'
      description: Never set `BASH_ENV`.
  sys_shellenv:
    type: string
    default: /etc/shellenv
    description: |-
      Deploy path for the system POSIX shell environment file. Sourced by
      `/etc/profile`, `/etc/zsh/zshenv`, and the bashenv file. Leave empty to skip
      deploying it (and to omit all `source` lines that reference it).
  sys_shellrc:
    type: string
    default: /etc/shellrc
    description: |-
      Deploy path for the shared interactive shell configuration (bash and zsh):
      GPG TTY, VS Code editor, dircolors, lesspipe, aliases, command-not-found.
      Leave empty to skip.
  sys_shellaliases:
    type: string
    default: /etc/shellaliases
    description: |-
      Deploy path for the system shell aliases file, sourced by the system shellrc
      for all interactive shells. Only portable `alias name=value` syntax belongs
      here (shared by bash and zsh); shell-specific aliases (e.g. zsh global/suffix
      aliases) belong in the respective shell's rc file. Leave empty to skip.
  sys_shellcompletions:
    type: string
    default: ''
    description: |-
      Deploy path for the Zsh completions hook file (a multi-writer `fpath` region
      that downstream features such as `install-zsh-completion` also write to).
      Leave empty to use `$(shell__detect_zshdir)/shellcompletions`. When you
      customize this, set a matching `rcfile` in `install-zsh-completion`.
  sys_bashenv:
    type: string
    default: ''
    description: |-
      Deploy path for the system Bash non-interactive environment file (the
      `BASH_ENV` target). Leave empty to use the path next to the detected system
      bashrc (e.g. `/etc/bashenv` or `/etc/bash/bashenv`).
  user_shellenv:
    type: string
    default: .shellenv
    description: |-
      Per-user shell environment file (POSIX sh only), relative to `$HOME`. Sourced
      by `~/.zshenv` (every zsh invocation) and `~/.bash_profile` (bash login).
      Leave empty to skip deploying it and its source hooks.
  user_shellrc:
    type: string
    default: .shellrc
    description: |-
      Per-user interactive config shared by bash and zsh (POSIX sh), relative to
      `$HOME`. Sourced from `~/.bashrc` and `$ZDOTDIR/.zshrc`. Leave empty to skip.
  user_bashtheme:
    type: string
    default: '${XDG_CONFIG_HOME:-${HOME}/.config}/bash/bashtheme'
    description: |-
      Per-user Bash theme scaffold file (prompt / Oh My Bash / Starship). Sourced
      from `~/.bashrc`. Downstream features append to it via `shell__write_block`.
      Accepts `~`, `$HOME`, and `${VAR:-default}` expressions. Leave empty to skip.
      When you customize this, set the matching theme-file option in downstream
      features (`rcfile` in `install-ohmybash`, `bash_rcfile` in `install-starship`)
      — left empty, they resolve the default path on their own.
  user_zshtheme:
    type: string
    default: '${ZDOTDIR}/zshtheme'
    description: |-
      Per-user Zsh theme scaffold file (Oh My Zsh / Starship). Sourced from
      `$ZDOTDIR/.zshrc`. Downstream features append to it via `shell__write_block`.
      Accepts `~`, `$HOME`, `$ZDOTDIR`, and `${VAR:-default}` expressions. Leave
      empty to skip. When you customize this, set the matching theme-file option in
      downstream features (`rcfile` in `install-ohmyzsh`, `zsh_rcfile` in
      `install-starship`) — left empty, they resolve the default path on their own.
  zdotdir:
    type: string
    default: ''
    description: |-
      Directory Zsh uses for its per-user config files (`.zshrc`, `.zprofile`);
      corresponds to the `ZDOTDIR` variable exported in `~/.zshenv`.
      Leave empty for `${XDG_CONFIG_HOME}/zsh` (i.e. `~/.config/zsh`). Accepts paths
      prefixed with `~` or `$HOME`. Only applies when `setup_zsh` is not `false`.
  if_exists_sys:
    type: string
    default: auto
    description: |-
      Lifecycle for system files (`/etc/*`) and the `/etc/environment` `BASH_ENV`
      line. Note: a `fail` conflict in ANY scope aborts the entire run (all scopes),
      not just the failing one.
    enum:
    - value: auto
      description: Devcontainer build → `reinstall`; standalone → `update`.
    - value: skip
      description: Existing paths are left untouched; absent paths are created from enabled blocks.
    - value: update
      description: Block-sync on existing paths (inject/sync/remove managed markers); non-managed bytes are never modified.
    - value: reinstall
      description: Assemble enabled blocks into a new file, backing up any existing file first. Foreign managed blocks are carried over unless `preserve_managed_blocks=false`.
    - value: fail
      description: Abort with zero writes if any target would modify an existing file.
    - value: uninstall
      description: Strip setup-shell markers; delete the file if it becomes empty.
  if_exists_skel:
    type: string
    default: inherit
    description: Lifecycle for `/etc/skel/*` targets. Inherits the resolved `if_exists_sys` when `inherit`.
    enum:
    - value: inherit
      description: Use the resolved `if_exists_sys` mode.
    - value: auto
      description: Devcontainer build → `reinstall`; standalone → `update`.
    - value: skip
      description: Leave existing skel paths untouched; create absent ones from enabled blocks.
    - value: update
      description: Block-sync skel targets.
    - value: reinstall
      description: Reassemble skel targets from enabled blocks; foreign managed blocks are carried over unless `preserve_managed_blocks=false`.
    - value: fail
      description: Abort if any skel target would modify an existing file.
    - value: uninstall
      description: Strip skel markers; delete empty skel files.
  if_exists_user:
    type: string
    default: inherit
    description: Lifecycle for live per-user dotfiles. Inherits the resolved `if_exists_sys` when `inherit`.
    enum:
    - value: inherit
      description: Use the resolved `if_exists_sys` mode.
    - value: auto
      description: Devcontainer build → `reinstall`; standalone → `update`.
    - value: skip
      description: Leave existing user dotfiles untouched; create absent ones from enabled blocks.
    - value: update
      description: Block-sync user dotfiles.
    - value: reinstall
      description: Reassemble user dotfiles from enabled blocks; foreign managed blocks are carried over unless `preserve_managed_blocks=false`.
    - value: fail
      description: Abort if any user target would modify an existing file.
    - value: uninstall
      description: Strip user dotfile markers; delete empty files.
  backup:
    type: string
    default: auto
    description: Whether to back up files before a `reinstall` overwrites them.
    enum:
    - value: auto
      description: Back up outside devcontainers/Codespaces; skip inside (disposable container).
    - value: 'true'
      description: Always back up before overwriting.
    - value: 'false'
      description: Never back up.
  backup_dir:
    type: array
    default: |
      ${{ _env_vars._FEAT_SHARE_DIR_ROOT }}$/backups
      ${HOME}/.local/share/${{ _project.namespace }}$/${{ id }}$/backups
    description: |-
      Ordered candidate directories for system/skel file backups. The first
      writable entry is used, resolved via `users__first_writeable_path` at run
      time. Per-user dotfile backups go to each target user's own share
      directory instead, falling back to this resolved directory.
  preserve_managed_blocks:
    type: boolean
    default: true
    description: |-
      When a `reinstall` replaces a file, carry over foreign *managed blocks* —
      regions delimited by `# >>> <marker> >>>` / `# <<< <marker> <<<` guard
      comments written by other features or tools (e.g. Homebrew's `brew shellenv`
      activation, rustup, nvm) — into the freshly assembled file, so a
      `setup-shell` reinstall no longer wipes them. setup-shell's own blocks
      (markers prefixed `setup-shell-`) are always regenerated from enabled
      blocks and never carried over. When `false`, `reinstall` performs a strict
      whole-file replace and foreign managed blocks survive only in the backup.
      Only affects `reinstall`; `update` and `skip` never modify non-managed
      bytes regardless of this option.
  managed_block_markers:
    type: array
    default: ""
    description: |-
      Allowlist of glob patterns (one per line) matched against a managed block's
      marker to decide whether `reinstall` preserves that block. When empty (the
      default), every foreign managed block is preserved. When non-empty, only
      blocks whose marker matches at least one pattern are kept — e.g.
      `* (install-*)` to preserve only DevFeats-written blocks. Ignored when
      `preserve_managed_blocks` is `false`; setup-shell's own `setup-shell-*`
      markers are never preserved regardless of this list.
  ? |
    *{{ #{{
      blocks = get("_internal.blocks") or {}
      opts = {}
      for meta in blocks.values():
          option = meta.get("option")
          if not option or option in opts:
              continue
          otype = meta.get("option_type", "boolean")
          default = meta.get("default")
          if default is None:
              default = True if otype == "boolean" else ""
          desc = meta.get("description", f"Include the {option} block.")
          od = {
              "type": "boolean" if otype == "boolean" else "string",
              "default": default,
              "description": desc,
          }
          if otype == "enum" and meta.get("enum"):
              od["enum"] = meta["enum"]
          opts[option] = od
      return opts
    }}# }}*
  :
_options:
  configure_users: true
  installer_dir: false
_internal:
  blocks:
    # --- /etc/shellenv (sys_shellenv) ---
    shellenv-preamble:
      marker: setup-shell-shellenv-preamble
      kind: fixed
      slice: blocks/shellenv-preamble.slice
      description: 'Always-on double-source guard (_SHELLENV_LOADED): zsh login shells reach the shellenv via both zshenv and zprofile→profile — re-sourcing is safe but wasteful, so the guard returns early.'
    shellenv-extend-path:
      marker: setup-shell-shellenv-extend-path
      kind: fixed
      slice: blocks/shellenv-extend-path.slice
      option: block_sys_shellenv_extend_path
      option_type: boolean
      default: true
      description: 'Deploy the extend_path() helper in the system shellenv: prepend/append PATH dirs without duplicates, skipping missing dirs, safe for paths with spaces (newline-IFS internally). Run `extend_path --help` for usage.'
    shellenv-umask:
      marker: setup-shell-shellenv-umask
      kind: dynamic
      dynamic: _dyn_shellenv_umask
      option: block_sys_shellenv_umask
      option_type: string
      default: '022'
      description: 'umask value written to the system shellenv. Leave empty to skip.'
    shellenv-user-home:
      marker: setup-shell-shellenv-user-home
      kind: fixed
      slice: blocks/shellenv-user-home.slice
      option: block_sys_shellenv_user_home
      option_type: boolean
      default: true
      description: 'Set USER/HOME in the system shellenv when unset (e.g. su without -l).'
    shellenv-path-helper:
      marker: setup-shell-shellenv-path-helper
      kind: fixed
      slice: blocks/shellenv-path-helper.slice
      option: block_sys_shellenv_path_helper
      option_type: boolean
      default: true
      description: 'On macOS, run path_helper first so extend_path layers on /etc/paths and /etc/paths.d (guarded; no-op on Linux).'
    shellenv-path-baseline:
      marker: setup-shell-shellenv-path-baseline
      kind: dynamic
      dynamic: _dyn_shellenv_path_baseline
      option: block_sys_shellenv_path_baseline
      option_type: string
      default: '$HOME/.local/bin $HOME/bin /usr/local/sbin /usr/local/bin /usr/sbin /usr/bin /sbin /bin'
      description: 'Space-separated directories prepended to PATH via extend_path to establish a known-good baseline (plus /usr/games appended for non-root). sbin dirs are included for all users so tools like ifconfig, ip, and fdisk resolve without sudo -i. Leave empty to skip.'
    shellenv-xdg-data-dirs:
      marker: setup-shell-shellenv-xdg-data-dirs
      kind: dynamic
      dynamic: _dyn_shellenv_xdg_data_dirs
      option: block_sys_shellenv_xdg_data_dirs
      option_type: string
      default: /usr/local/share:/usr/share
      description: 'Export XDG_DATA_DIRS (system data dir search path). Leave empty to skip.'
    shellenv-xdg-config-dirs:
      marker: setup-shell-shellenv-xdg-config-dirs
      kind: dynamic
      dynamic: _dyn_shellenv_xdg_config_dirs
      option: block_sys_shellenv_xdg_config_dirs
      option_type: string
      default: /etc/xdg
      description: 'Export XDG_CONFIG_DIRS (system config dir search path). Leave empty to skip.'
    shellenv-xdg-cache-home:
      marker: setup-shell-shellenv-xdg-cache-home
      kind: dynamic
      dynamic: _dyn_shellenv_xdg_cache_home
      option: block_sys_shellenv_xdg_cache_home
      option_type: string
      default: .cache
      description: 'XDG_CACHE_HOME default relative to HOME (guarded). Leave empty to skip.'
    shellenv-xdg-config-home:
      marker: setup-shell-shellenv-xdg-config-home
      kind: dynamic
      dynamic: _dyn_shellenv_xdg_config_home
      option: block_sys_shellenv_xdg_config_home
      option_type: string
      default: .config
      description: 'XDG_CONFIG_HOME default relative to HOME (guarded). Leave empty to skip.'
    shellenv-xdg-data-home:
      marker: setup-shell-shellenv-xdg-data-home
      kind: dynamic
      dynamic: _dyn_shellenv_xdg_data_home
      option: block_sys_shellenv_xdg_data_home
      option_type: string
      default: .local/share
      description: 'XDG_DATA_HOME default relative to HOME (guarded). Leave empty to skip.'
    shellenv-xdg-state-home:
      marker: setup-shell-shellenv-xdg-state-home
      kind: dynamic
      dynamic: _dyn_shellenv_xdg_state_home
      option: block_sys_shellenv_xdg_state_home
      option_type: string
      default: .local/state
      description: 'XDG_STATE_HOME default relative to HOME (guarded). Leave empty to skip.'
    shellenv-locale:
      marker: setup-shell-shellenv-locale
      kind: dynamic
      dynamic: _dyn_shellenv_locale
      option: block_sys_shellenv_locale
      option_type: string
      default: en_US.UTF-8
      description: 'Export LANG and LC_ALL in the system shellenv. Leave empty to skip.'
    shellenv-editor:
      marker: setup-shell-shellenv-editor
      kind: dynamic
      dynamic: _dyn_shellenv_editor
      option: block_sys_shellenv_editor
      option_type: enum
      default: auto
      description: 'Set VISUAL (full-screen editor) and EDITOR (line-oriented fallback) when both are unset; honored by sudoedit, crontab, git, etc. Use skip to omit.'
      enum:
      - value: auto
        description: Prefer nano; fall back to vi.
      - value: nano
        description: Use nano.
      - value: vim
        description: Use vim.
      - value: neovim
        description: Use nvim.
      - value: emacs
        description: Use emacs.
      - value: code
        description: Use VS Code (code --wait).
      - value: skip
        description: Do not set VISUAL/EDITOR.
    # --- /etc/shellrc (sys_shellrc) ---
    shellrc-guard:
      marker: setup-shell-shellrc-guard
      kind: fixed
      slice: blocks/interactive-guard.slice
      option: block_sys_shellrc_guard
      option_type: boolean
      default: true
      description: 'Return immediately when the system shellrc is sourced non-interactively.'
    shellrc-shellenv:
      marker: setup-shell-shellrc-shellenv
      kind: dynamic
      dynamic: _dyn_source_sys_shellenv
      option: block_sys_shellrc_shellenv
      option_type: boolean
      default: true
      description: 'Source the system shellenv from shellrc so PATH/XDG/umask apply to non-login interactive shells.'
    shellrc-gpg-tty:
      marker: setup-shell-shellrc-gpg-tty
      kind: fixed
      slice: blocks/shellrc-gpg-tty.slice
      option: block_sys_shellrc_gpg_tty
      option_type: boolean
      default: true
      description: 'Export GPG_TTY from $TTY (set by the shell at startup — faster and more reliable than $(tty), and safe during powerlevel10k instant prompt) and refresh the agent TTY via gpg-connect-agent so pinentry appears in the current terminal. Fixes "gpg: signing failed: Inappropriate ioctl for device" (VS Code, SSH).'
    shellrc-vscode-editor:
      marker: setup-shell-shellrc-vscode-editor
      kind: fixed
      slice: blocks/shellrc-vscode-editor.slice
      option: block_sys_shellrc_vscode_editor
      option_type: boolean
      default: true
      description: 'When TERM_PROGRAM=vscode, set VISUAL/EDITOR to `code --wait` (or `code-insiders --wait`, detected via VSCODE_GIT_ASKPASS_MAIN) for commit messages, sudoedit, crontab -e, etc. Git honors it via $VISUAL when GIT_EDITOR and core.editor are unset; outside VS Code the shellenv editor block applies.'
    shellrc-dircolors:
      marker: setup-shell-shellrc-dircolors
      kind: fixed
      slice: blocks/shellrc-dircolors.slice
      option: block_sys_shellrc_dircolors
      option_type: boolean
      default: true
      description: 'Load LS_COLORS via dircolors — or gdircolors on macOS with Homebrew coreutils outside gnubin — honoring a per-user ~/.dircolors override.'
    shellrc-color-aliases:
      marker: setup-shell-shellrc-color-aliases
      kind: fixed
      slice: blocks/shellrc-color-aliases.slice
      option: block_sys_shellrc_color_aliases
      option_type: boolean
      default: true
      description: 'Colorized ls (GNU --color=auto, BSD -G fallback on macOS) and grep/fgrep/egrep aliases when supported; dir/vdir aliases only where those GNU-coreutils commands exist.'
    shellrc-lesspipe:
      marker: setup-shell-shellrc-lesspipe
      kind: fixed
      slice: blocks/shellrc-lesspipe.slice
      option: block_sys_shellrc_lesspipe
      option_type: boolean
      default: true
      description: 'Enable the lesspipe/lesspipe.sh preprocessor so less can display non-text files (archives, images, etc.).'
    shellrc-gcc-colors:
      marker: setup-shell-shellrc-gcc-colors
      kind: fixed
      slice: blocks/shellrc-gcc-colors.slice
      option: block_sys_shellrc_gcc_colors
      option_type: boolean
      default: true
      description: 'Export GCC_COLORS for colorized compiler diagnostics.'
    shellrc-cnf:
      marker: setup-shell-shellrc-cnf
      kind: fixed
      slice: blocks/shellrc-cnf.slice
      option: block_sys_shellrc_cnf
      option_type: boolean
      default: true
      description: 'command-not-found handler for bash and zsh when the distro helper is installed.'
    shellrc-sudo-hint:
      marker: setup-shell-shellrc-sudo-hint
      kind: fixed
      slice: blocks/shellrc-sudo-hint.slice
      option: block_sys_shellrc_sudo_hint
      option_type: boolean
      default: true
      description: 'One-time sudo usage hint for admin/sudo group members (until first sudo or ~/.hushlogin).'
    shellrc-shellaliases:
      marker: setup-shell-shellrc-shellaliases
      kind: dynamic
      dynamic: _dyn_source_sys_shellaliases
      option: block_sys_shellrc_shellaliases
      option_type: boolean
      default: true
      description: 'Source the system shellaliases file from shellrc.'
    # --- /etc/shellaliases (sys_shellaliases) ---
    shellaliases-ls:
      marker: setup-shell-shellaliases-ls
      kind: fixed
      slice: blocks/shellaliases-ls.slice
      option: block_sys_shellaliases_ls
      option_type: boolean
      default: true
      description: 'System-wide ll, la, and l aliases.'
    # --- shellcompletions (sys_shellcompletions) ---
    shellcompletions-fpath-baseline:
      marker: setup-shell-shellcompletions-fpath-baseline
      kind: dynamic
      dynamic: _dyn_shellcompletions_fpath_baseline
      option: block_sys_shellcompletions_fpath_baseline
      option_type: boolean
      default: true
      description: 'Add zsh fpath entries for the system completions dir and ~/.zfunc.'
    # --- bashenv (sys_bashenv) ---
    bashenv-shellenv:
      marker: setup-shell-bashenv-shellenv
      kind: dynamic
      dynamic: _dyn_source_sys_shellenv
      option: block_sys_bashenv_shellenv
      option_type: boolean
      default: true
      description: 'Source the system shellenv from the bashenv (BASH_ENV target).'
    # --- /etc/profile (sys_profile) ---
    profile-shellenv:
      marker: setup-shell-profile-shellenv
      kind: dynamic
      dynamic: _dyn_source_sys_shellenv
      option: block_sys_profile_shellenv
      option_type: boolean
      default: true
      inject_anchor: file-top-after-comments
      description: 'Source the system shellenv at the top of /etc/profile.'
    profile-profiled:
      marker: setup-shell-profile-profiled
      kind: fixed
      slice: blocks/profile-profiled.slice
      option: block_sys_profile_profiled
      option_type: boolean
      default: true
      inject_anchor: eof
      description: 'Source /etc/profile.d/*.sh — via run-parts when available (consistent ordering and filename filtering), else a plain glob.'
    profile-interactive:
      marker: setup-shell-profile-interactive
      kind: fixed
      slice: blocks/profile-interactive.slice
      option: block_sys_profile_interactive
      option_type: boolean
      default: true
      inject_anchor: eof
      description: 'For interactive shells: in bash, source the first readable system bashrc (searching /etc/bash.bashrc, /etc/bash/bashrc, /etc/bashrc in order); in plain sh, set a minimal PS1 (# for root, $ otherwise).'
    # --- system bashrc (sys_bashrc) ---
    sys-bashrc-guard:
      marker: setup-shell-sys-bashrc-guard
      kind: fixed
      slice: blocks/interactive-guard.slice
      option: block_sys_bashrc_guard
      option_type: boolean
      default: true
      inject_anchor: after-interactivity-guard-or-eof
      description: 'Return immediately when the system bashrc is sourced non-interactively.'
    sys-bashrc-shellrc:
      marker: setup-shell-sys-bashrc-shellrc
      kind: dynamic
      dynamic: _dyn_source_sys_shellrc
      option: block_sys_bashrc_shellrc
      option_type: boolean
      default: true
      inject_anchor: after-interactivity-guard-or-eof
      description: 'Source the system shellrc from the system bashrc (shared aliases, colors, gpg, etc.).'
    sys-bashrc-ps1:
      marker: setup-shell-sys-bashrc-ps1
      kind: fixed
      slice: blocks/sys-bashrc-ps1.slice
      option: block_sys_bashrc_ps1
      option_type: boolean
      default: true
      inject_anchor: after-interactivity-guard-or-eof
      description: 'Default bash PS1 (\u@\h:\w\$); override in ~/.bashrc.'
    sys-bashrc-history:
      marker: setup-shell-sys-bashrc-history
      kind: fixed
      slice: blocks/sys-bashrc-history.slice
      option: block_sys_bashrc_history
      option_type: boolean
      default: true
      inject_anchor: after-interactivity-guard-or-eof
      description: 'Bash history tuning: HISTIGNORE (pwd/exit/clear), HISTCONTROL dedup (erasedups/ignoredups/ignorespace), size limits, per-entry timestamps for audit, histappend, and a PROMPT_COMMAND that appends+reloads after each command to keep concurrent sessions in sync.'
    sys-bashrc-shopt:
      marker: setup-shell-sys-bashrc-shopt
      kind: fixed
      slice: blocks/sys-bashrc-shopt.slice
      option: block_sys_bashrc_shopt
      option_type: boolean
      default: true
      inject_anchor: after-interactivity-guard-or-eof
      description: 'Enable bash checkwinsize (update LINES/COLUMNS after each command to track terminal resizes).'
    sys-bashrc-completion:
      marker: setup-shell-sys-bashrc-completion
      kind: fixed
      slice: blocks/sys-bashrc-completion.slice
      option: block_sys_bashrc_completion
      option_type: boolean
      default: true
      inject_anchor: after-interactivity-guard-or-eof
      description: 'Load bash-completion when not in posix mode.'
    sys-bashrc-term-program:
      marker: setup-shell-sys-bashrc-term-program
      kind: fixed
      slice: blocks/sys-bashrc-term-program.slice
      option: block_sys_bashrc_term_program
      option_type: boolean
      default: true
      inject_anchor: after-interactivity-guard-or-eof
      description: 'Source a terminal-specific rc (bashrc_$TERM_PROGRAM, next to the system bashrc) when readable. Last block by design so terminal integration can override anything above.'
    # --- system zshenv (sys_zshenv) ---
    zsh-zshenv-shellenv:
      marker: setup-shell-zsh-zshenv-shellenv
      kind: dynamic
      dynamic: _dyn_source_sys_shellenv_zsh
      option: block_sys_zshenv_shellenv
      option_type: boolean
      default: true
      description: 'Source the system shellenv from zshenv via emulate sh (every zsh invocation).'
    # --- system zprofile (sys_zprofile) ---
    zsh-zprofile-profile:
      marker: setup-shell-zsh-zprofile-profile
      kind: fixed
      slice: blocks/zsh-zprofile-profile.slice
      option: block_sys_zprofile_profile
      option_type: boolean
      default: true
      description: 'Source /etc/profile from zprofile via emulate sh (zsh login shells).'
    # --- system zshrc (sys_zshrc) ---
    zsh-zshrc-guard:
      marker: setup-shell-zsh-zshrc-guard
      kind: fixed
      slice: blocks/interactive-guard.slice
      option: block_sys_zshrc_guard
      option_type: boolean
      default: true
      inject_anchor: after-interactivity-guard-or-eof
      description: 'Return immediately when the system zshrc is sourced non-interactively.'
    zsh-zshrc-shellrc:
      marker: setup-shell-zsh-zshrc-shellrc
      kind: dynamic
      dynamic: _dyn_source_sys_shellrc
      option: block_sys_zshrc_shellrc
      option_type: boolean
      default: true
      inject_anchor: after-interactivity-guard-or-eof
      description: 'Source the system shellrc from the system zshrc (shared interactive config).'
    zsh-zshrc-prompt:
      marker: setup-shell-zsh-zshrc-prompt
      kind: fixed
      slice: blocks/zsh-zshrc-prompt.slice
      option: block_sys_zshrc_prompt
      option_type: boolean
      default: true
      inject_anchor: after-interactivity-guard-or-eof
      description: 'Minimal default zsh PROMPT (%n@%m:%~%# — the %# shows # for root, %% otherwise); themes/oh-my-zsh override it in the user zshrc.'
    zsh-zshrc-readnullcmd:
      marker: setup-shell-zsh-zshrc-readnullcmd
      kind: fixed
      slice: blocks/zsh-zshrc-readnullcmd.slice
      option: block_sys_zshrc_readnullcmd
      option_type: boolean
      default: true
      inject_anchor: after-interactivity-guard-or-eof
      description: 'Set READNULLCMD to $PAGER or /usr/bin/pager for zsh null reads.'
    zsh-zshrc-keybindings:
      marker: setup-shell-zsh-zshrc-keybindings
      kind: fixed
      slice: blocks/zsh-zshrc-keybindings.slice
      option: block_sys_zshrc_keybindings
      option_type: boolean
      default: true
      inject_anchor: after-interactivity-guard-or-eof
      description: 'Terminfo-based key bindings for emacs/vi maps (DEBIAN_PREVENT_KEYBOARD_CHANGES opt-out; smkx/rmkx line init).'
    zsh-zshrc-zstyle:
      marker: setup-shell-zsh-zshrc-zstyle
      kind: fixed
      slice: blocks/zsh-zshrc-zstyle.slice
      option: block_sys_zshrc_zstyle
      option_type: boolean
      default: true
      inject_anchor: after-interactivity-guard-or-eof
      description: 'Completion zstyles set before compinit: sudo command-path extended with sbin dirs, completer order (expand/complete/correct/approximate), case-insensitive and partial matching, LS_COLORS-based colouring, scrollable menu for long lists, and kill-completion process highlighting.'
    zsh-zshrc-pre-compinit:
      marker: setup-shell-zsh-zshrc-pre-compinit
      kind: dynamic
      dynamic: _dyn_source_sys_shellcompletions
      option: block_sys_zshrc_pre_compinit
      option_type: boolean
      default: true
      inject_anchor: after-interactivity-guard-or-eof
      description: 'Source the shellcompletions fpath file before compinit.'
    zsh-zshrc-compinit:
      marker: setup-shell-zsh-zshrc-compinit
      kind: fixed
      slice: blocks/zsh-zshrc-compinit.slice
      option: block_sys_zshrc_compinit
      option_type: boolean
      default: true
      inject_anchor: after-interactivity-guard-or-eof
      description: 'Run compinit after the zstyle block so styles apply before completions load; skip_global_compinit=1 tells oh-my-zsh to skip its own compinit call, ensuring compinit runs exactly once.'
    zsh-zshrc-run-help:
      marker: setup-shell-zsh-zshrc-run-help
      kind: fixed
      slice: blocks/zsh-zshrc-run-help.slice
      option: block_sys_zshrc_run_help
      option_type: boolean
      default: true
      inject_anchor: after-interactivity-guard-or-eof
      description: 'Replace the built-in run-help→man alias with zsh''s autoloadable run-help function, which understands zsh builtins.'
    zsh-zshrc-history:
      marker: setup-shell-zsh-zshrc-history
      kind: fixed
      slice: blocks/zsh-zshrc-history.slice
      option: block_sys_zshrc_history
      option_type: boolean
      default: true
      inject_anchor: after-interactivity-guard-or-eof
      description: 'Zsh history tuning: emacs line editing (bindkey -e), HISTSIZE=10000 in memory / SAVEHIST=5000 in ~/.zsh_history, drop older duplicates, share history across sessions in real time, record timestamps+duration (extended_history), and skip space-prefixed commands.'
    zsh-zshrc-combining-chars:
      marker: setup-shell-zsh-zshrc-combining-chars
      kind: fixed
      slice: blocks/zsh-zshrc-combining-chars.slice
      option: block_sys_zshrc_combining_chars
      option_type: boolean
      default: true
      inject_anchor: after-interactivity-guard-or-eof
      description: 'setopt COMBINING_CHARS when LC_CTYPE is UTF-8, so characters composed from a base plus combining Unicode codepoints (e.g. accented letters) display correctly.'
    zsh-zshrc-term-program:
      marker: setup-shell-zsh-zshrc-term-program
      kind: fixed
      slice: blocks/zsh-zshrc-term-program.slice
      option: block_sys_zshrc_term_program
      option_type: boolean
      default: true
      inject_anchor: after-interactivity-guard-or-eof
      description: 'Source a terminal-specific rc (zshrc_$TERM_PROGRAM, next to the system zshrc — e.g. dropped in by Terminal.app or iTerm2) when readable; resolves its own directory via ${(%):-%x}. Last block by design so it can override anything above.'
    # --- /etc/environment BASH_ENV line ---
    environment-bash-env:
      marker: setup-shell-environment-bash-env
      kind: dynamic
      dynamic: _dyn_environment_bash_env
      option: block_sys_environment_bash_env
      option_type: boolean
      default: true
      description: 'Set BASH_ENV to the system bashenv path in /etc/environment.'
    # --- user/skel .shellenv ---
    user-shellenv-preamble:
      marker: setup-shell-user-shellenv-preamble
      kind: fixed
      slice: blocks/user-shellenv-preamble.slice
      description: 'Always-on sentinel guard (_USER_SHELLENV_LOADED): prevents double-sourcing when both ~/.zshenv and ~/.zprofile → ~/.bash_profile source the user shellenv in the same session.'
    user-shellenv-xdg:
      marker: setup-shell-user-shellenv-xdg
      kind: dynamic
      dynamic: _dyn_user_shellenv_xdg
      option: block_user_shellenv_xdg
      option_type: boolean
      default: true
      description: 'Guarded user XDG_*_HOME exports in the user shellenv, derived from the four block_sys_shellenv_xdg_*_home options (empty option = line omitted).'
    # --- user/skel .shellrc ---
    user-shellrc-guard:
      marker: setup-shell-user-shellrc-guard
      kind: fixed
      slice: blocks/interactive-guard.slice
      option: block_user_shellrc_guard
      option_type: boolean
      default: true
      description: 'Return immediately when the user shellrc is sourced non-interactively.'
    # --- user/skel .bash_profile ---
    user-bashprofile-shellenv:
      marker: setup-shell-user-bashprofile-shellenv
      kind: dynamic
      dynamic: _dyn_user_bashprofile_shellenv
      option: block_user_bashprofile_shellenv
      option_type: boolean
      default: true
      inject_anchor: eof
      description: 'Source user_shellenv from ~/.bash_profile (login env for bash and zsh-via-zprofile).'
    user-bashprofile-bashrc:
      marker: setup-shell-user-bashprofile-bashrc
      kind: fixed
      slice: blocks/user-bashprofile-bashrc.slice
      option: block_user_bashprofile_bashrc
      option_type: boolean
      default: true
      inject_anchor: eof
      description: 'Source ~/.bashrc from ~/.bash_profile when BASH is set (skipped when zsh sources this via emulate sh).'
    # --- user/skel .bashrc ---
    user-bashrc-interactive-guard:
      marker: setup-shell-user-bashrc-interactive-guard
      kind: fixed
      slice: blocks/interactive-guard.slice
      option: block_user_bashrc_interactive_guard
      option_type: boolean
      default: true
      inject_anchor: eof
      description: 'Return immediately when ~/.bashrc is sourced non-interactively.'
    user-bashrc-bashtheme:
      marker: setup-shell-user-bashrc-bashtheme
      kind: dynamic
      dynamic: _dyn_user_bashrc_bashtheme
      option: block_user_bashrc_bashtheme
      option_type: boolean
      default: true
      inject_anchor: eof
      description: 'Source user_bashtheme (prompt/framework; Starship, Oh My Bash, etc.).'
    user-bashrc-shellrc:
      marker: setup-shell-user-bashrc-shellrc
      kind: dynamic
      dynamic: _dyn_user_bashrc_shellrc
      option: block_user_bashrc_shellrc
      option_type: boolean
      default: true
      inject_anchor: eof
      description: 'Source user_shellrc (shared POSIX aliases, functions, cross-shell tool init) from ~/.bashrc.'
    # --- user/skel .zshenv ---
    user-zshenv-shellenv:
      marker: setup-shell-user-zshenv-shellenv
      kind: dynamic
      dynamic: _dyn_user_zshenv_shellenv
      option: block_user_zshenv_shellenv
      option_type: boolean
      default: true
      inject_anchor: eof
      description: 'Source user_shellenv from ~/.zshenv via emulate sh (every zsh invocation).'
    user-zshenv-zdotdir:
      marker: setup-shell-zdotdir
      kind: dynamic
      dynamic: _dyn_user_zshenv_zdotdir
      option: block_user_zshenv_zdotdir
      option_type: boolean
      default: true
      inject_anchor: eof
      description: 'Export ZDOTDIR for the per-user zsh config directory.'
    # --- user/skel .zprofile ---
    user-zprofile-bashprofile:
      marker: setup-shell-user-zprofile-bashprofile
      kind: fixed
      slice: blocks/user-zprofile-bashprofile.slice
      description: 'Always-on: delegate zsh login-shell setup to ~/.bash_profile via emulate sh, so login config is defined once; the $BASH guard there keeps ~/.bashrc from loading under zsh.'
    # --- user/skel .zshrc ---
    user-zshrc-guard:
      marker: setup-shell-user-zshrc-guard
      kind: fixed
      slice: blocks/interactive-guard.slice
      option: block_user_zshrc_guard
      option_type: boolean
      default: true
      inject_anchor: eof
      description: 'Return immediately when $ZDOTDIR/.zshrc is sourced non-interactively.'
    user-zshrc-zshtheme:
      marker: setup-shell-user-zshrc-zshtheme
      kind: dynamic
      dynamic: _dyn_user_zshrc_zshtheme
      option: block_user_zshrc_zshtheme
      option_type: boolean
      default: true
      inject_anchor: eof
      description: 'Source user_zshtheme (Oh My Zsh, Starship, etc.) from $ZDOTDIR/.zshrc.'
    user-zshrc-shellrc:
      marker: setup-shell-user-zshrc-shellrc
      kind: dynamic
      dynamic: _dyn_user_zshrc_shellrc
      option: block_user_zshrc_shellrc
      option_type: boolean
      default: true
      inject_anchor: eof
      description: 'Source user_shellrc from $ZDOTDIR/.zshrc.'
