    when: _ss_target_user_zsh
    blocks: [user-zprofile-bashprofile]
  - id: user_zshrc
    lifecycle_scope: user
    path_resolver: _ss_resolve_user_zshrc
    when: _ss_target_user_zsh
    blocks: [user-zshrc-guard, user-zshrc-zshtheme, user-zshrc-shellrc]
_files:
- path: blocks.registry.bash
  content: |
    #{{
      import json
      blocks = get("_internal.blocks") or {}
      targets = get("_internal.targets") or []
      lines = [
          "# shellcheck shell=bash",
          "# Generated from metadata _internal via pyserials — do not edit.",
          "",
      ]
      order = " ".join('"%s"' % t["id"] for t in targets)
      lines.append("_FEAT_SS_TARGET_ORDER=( %s )" % order)
      lines.append("")

      def emit_map(name, pairs):
          # pairs: list of (key, value); skip empty values.
          items = [(k, v) for k, v in pairs if v != "" and v is not None]
          if not items:
              lines.append("declare -gA %s=()" % name)
              return
          lines.append("declare -gA %s=(" % name)
          for k, v in items:
              lines.append('  [%s]=%s' % (json.dumps(k), json.dumps(str(v))))
          lines.append(")")

      emit_map("_FEAT_SS_TARGET_SCOPE", [(t["id"], t["lifecycle_scope"]) for t in targets])
      emit_map("_FEAT_SS_TARGET_WHEN", [(t["id"], t.get("when", "")) for t in targets])
      emit_map("_FEAT_SS_TARGET_DEPLOY_OPTION", [(t["id"], t.get("deploy_option", "").upper()) for t in targets])
      emit_map("_FEAT_SS_TARGET_DEFAULT_PATH", [(t["id"], t.get("default_path", "")) for t in targets])
      emit_map("_FEAT_SS_TARGET_PATH_RESOLVER", [(t["id"], t.get("path_resolver", "")) for t in targets])
      emit_map("_FEAT_SS_TARGET_BLOCKS", [(t["id"], " ".join(t.get("blocks", []))) for t in targets])
      emit_map("_FEAT_SS_LINE_RESOLVER", [(t["id"], t.get("line_resolver", "")) for t in targets])

      emit_map("_FEAT_SS_BLOCK_MARKER", [(b, m.get("marker", "setup-shell-%s" % b)) for b, m in blocks.items()])
      emit_map("_FEAT_SS_BLOCK_KIND", [(b, m.get("kind", "fixed")) for b, m in blocks.items()])
      emit_map("_FEAT_SS_BLOCK_OPTION", [(b, m.get("option", "").upper()) for b, m in blocks.items()])
      emit_map("_FEAT_SS_BLOCK_OPTION_TYPE", [(b, m.get("option_type", "")) for b, m in blocks.items()])
      emit_map("_FEAT_SS_BLOCK_SLICE", [(b, m.get("slice", "")) for b, m in blocks.items()])
      emit_map("_FEAT_SS_BLOCK_DYNAMIC", [(b, m.get("dynamic", "")) for b, m in blocks.items()])
      emit_map("_FEAT_SS_BLOCK_WHEN", [(b, m.get("when", "")) for b, m in blocks.items()])
      emit_map("_FEAT_SS_BLOCK_ANCHOR", [(b, m.get("inject_anchor", "")) for b, m in blocks.items()])
      emit_map("_FEAT_SS_BLOCK_PRECONDITION", [(b, m.get("precondition", "")) for b, m in blocks.items()])
      lines.append("")
      return "\n".join(lines) + "\n"
    }}#
_dependencies:
  run:
    base:
      packages:
        - when: {plat.pm: apt}
          packages: [locales]
        - when: {plat.pm: apk}
          packages: [musl-locales, musl-locales-lang]
        - when: {plat.pm: [dnf, yum]}
          packages: [glibc-langpack-en]
        - when: {plat.pm: zypper}
          packages: [glibc-i18ndata]
        - when: {plat.pm: pacman}
          packages: [glibc]

      scripts: |
        if command -v dpkg > /dev/null 2>&1; then
          sed -i 's/^# \(en_US\.UTF-8\)/\1/' /etc/locale.gen
          locale-gen
        fi
