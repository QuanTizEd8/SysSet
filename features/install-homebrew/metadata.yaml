name: Homebrew Installation
version: 0.1.0
description: Install the [Homebrew](https://brew.sh/) package manager.
keywords:
- homebrew
- linuxbrew
- brew
- package manager
- macos
_long_description: |-
  On **macOS** the feature ensures Xcode Command Line Tools are present before
  running the official installer. On **Linux** it installs the required
  build dependencies (git, curl, gcc, make, etc.) via the OS package manager
  first, then invokes the official installer.
  After installation the feature writes an `eval "$(brew shellenv)"` block to
  the appropriate shell startup files so that `brew` and any tools it installs
  are on `PATH` in subsequent shell sessions.
options:
  update:
    type: boolean
    default: true
    description: Run `brew update` after installation to fetch the latest formula index.
  brew_git_remote:
    type: string
    default: ''
    description: |-
      Override `HOMEBREW_BREW_GIT_REMOTE` — the git remote for the `Homebrew/brew` repository.
      Useful for air-gapped environments or mirrors.
  core_git_remote:
    type: string
    default: ''
    description: |-
      Override `HOMEBREW_CORE_GIT_REMOTE` — the git remote for the `homebrew-core` tap.
      Useful for air-gapped environments or mirrors.
  no_install_from_api:
    type: boolean
    default: false
    description: |-
      Set `HOMEBREW_NO_INSTALL_FROM_API=1` during installation.
      Forces `homebrew-core` to be cloned as a full git repository rather than relying on the JSON API.
      Slower but useful in environments where the API endpoint is blocked.
_options:
  verify:
    args: "--version"
    description: Verify Homebrew is installed and working.
    functional:
      description: brew resolves its installation prefix
      # `brew --prefix` resolves Homebrew's install prefix offline (no network,
      # no formula index) and, unlike most brew subcommands, runs cleanly as
      # root. The test harness runs the functional check as root, but Homebrew
      # refuses root for anything that downloads or mutates state — e.g.
      # `brew config` aborts with "Need to download … but cannot as root!"
      # (it fetches the formula index) — so a root-safe command is required
      # here. Non-root users, including the container's remote user, run
      # `brew config` and friends without issue (verified in a clean container).
      cmd: '{bin} --prefix > /dev/null 2>&1'
  gh_repo: Homebrew/install
  method:
    script:
      asset_uri: "https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh"
  prefix:
    root: /home/linuxbrew/.linuxbrew
    nonroot: "${HOME}/.linuxbrew"
    bins: [brew]
    symlink:
      skip: true
    platform_overrides:
      - when: {plat.kernel: Darwin, plat.machine_release: arm64}
        default: /opt/homebrew
      - when: {plat.kernel: Darwin}
        default: /usr/local
    discovery_snippet:
      # The snippet is written verbatim into the shell startup files (only
      # `{feat.prefix}` is expanded), so it must already be valid shell. The
      # previous `eval \$(...)` was mode-dependent: standalone preserved the
      # backslash, so profile.d got `eval \$(...)` — a syntax error that broke
      # brew's PATH discovery in login shells; devcontainer's ENV layer stripped
      # it to a working (but fragile, unquoted) `eval $(...)`. `eval "$(…
      # shellenv)"` is the correct, documented form and renders identically in
      # both modes; the single-quoted serialization prevents any premature
      # command substitution at build/assignment time.
      bash: 'eval "$(''{feat.prefix}/bin/brew'' shellenv)"'
      zsh: 'eval "$(''{feat.prefix}/bin/brew'' shellenv)"'
      fish: "eval ('{feat.prefix}/bin/brew' shellenv)"
    write_group:
      default: brew
_dependencies:
  run:
    base:
      when: {plat.kernel: linux}
      # Runtime tools required by Homebrew on Linux.
      # ref: https://docs.brew.sh/Homebrew-on-Linux#requirements
      #
      # Not needed on macOS — Xcode Command Line Tools provide these, and the
      # installer checks / installs CLT directly in the script.

      # Common packages — same name on all package managers.
      # `tar` is required: brew update installs Portable Ruby by unpacking a
      # .tar.gz (vendor-install.sh); minimal images often omit tar → "tar: command not found".
      packages:
        - git
        - curl
        - file
        - gzip
        - tar
  build:
    method-script:
      when: {plat.kernel: linux}
      # Build tools — names differ by ecosystem. Build-time only on Linux;
      # macOS provides these via Xcode CLT which is handled separately.
      #
      # Primary reference: https://docs.brew.sh/Homebrew-on-Linux#requirements
      # The upstream install.sh post-install hint also lists package groups /
      # packages per PM (apt-get, dnf, yum, pacman, apk). Homebrew does **not**
      # document openSUSE (zypper); the zypper list below is an explicit minimal
      # toolchain analogous to the usual `pattern(devel_basis)` bundle, without
      # installing that pattern (some `opensuse/leap:latest` images hit zypper
      # solver conflicts on `devel_basis`, breaking non-interactive CI).
      #
      # Together with `run.base` (git, curl, file, gzip, tar), each PM block matches
      # the doc one-liners where they exist:
      #   • apt:   build-essential procps  (+ run.base ≈ curl file git; gzip extra)
      #   • dnf:   group development-tools + procps-ng  (+ run.base)
      #   • pacman: base-devel + procps-ng  (+ run.base)
      #   • apk:   build-base  (+ run.base); procps added for ps/top parity with procps on apt/dnf.
      # zypper adds procps plus gcc/make/patch/headers/binutils/pkgconf/perl so
      # bottles and formula builds have a typical C/C++ build environment.

      packages:
        - when: {plat.pm: apt}
          packages: [build-essential]
        - when: {plat.pm: apk}
          packages: [build-base]
        - when: {plat.pm: [apt, apk, zypper]}
          packages: [procps]
        - when: {plat.pm: [dnf, yum, pacman]}
          packages: [procps-ng]
        - when: {plat.pm: zypper}
          # Explicit RPMs (see linux-build comment above), not pattern(devel_basis).
          packages: [binutils, gcc, gcc-c++, make, patch, glibc-devel, libstdc++-devel, perl, pkgconf]

      # Package groups for build toolchains
      groups:
        - name: development-tools
          when: {plat.pm: [dnf, yum]}
        - name: base-devel
          when: {plat.pm: pacman}

