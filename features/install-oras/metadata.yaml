name: ORAS Installation
version: 0.1.0
description: Install [ORAS](https://oras.land/) – an OCI registry client.
keywords:
  - oras
  - oci
  - registry
  - artifact
_long_description: |-
  ORAS (OCI Registry As Storage) is a CLI for working with OCI artifacts in container registries
  beyond container images. It is useful for publishing and consuming artifacts such as Helm charts,
  SBOMs, provenance/signature payloads, WASM modules, and other build outputs in registries like
  GHCR, Docker Hub, and private OCI-compliant registries.

  This feature installs the `oras` binary and makes it available on PATH so it can be used from
  build scripts, CI tasks, and interactive shell sessions. By default, the latest stable ORAS version is
  installed, or you can pin a specific release. The installer supports release-based installation
  and package-manager installation, with `auto` preferring the release path first.
_tool_name: ORAS
_options:
  verify:
    args: "version"
    description: Verify ORAS is installed and working.
    functional:
      description: oras pushes and pulls an artifact through a local OCI layout
      cmd: 'd=$(mktemp -d) && cd "$d" && echo hello > b.txt && {bin} push --oci-layout l:v1 b.txt >/dev/null 2>&1 && rm b.txt && {bin} pull --oci-layout l:v1 >/dev/null 2>&1 && grep -q hello b.txt; rc=$?; cd /; rm -rf "$d"; exit $rc'
  gh_repo: oras-project/oras
  version:
    resolution: github_release
    test_pins:
      pinned: ["1.2.3"]
      legacy: ["1.2.0"]
  method:
    binary:
      asset_uri: "https://github.com/${{ _options.gh_repo }}$/releases/download/{feat.tag}/oras_{feat.version}_{plat.kernel:lower}_{plat.machine_release}.tar.gz"
      binary_src:
        - oras
      gpg_key_uri: "https://raw.githubusercontent.com/${{ _options.gh_repo }}$/refs/heads/main/KEYS"
      when: {plat.machine_release: [amd64, arm64, armv7, ppc64le, s390x, riscv64, loong64]}
    package:
      when:
        - {plat.pm: [dnf, yum], os.id: fedora}
        - {plat.pm: apt, os.id: debian}
        - {plat.pm: apt, os.id: ubuntu, os.version_id: ["25.04", "25.10", "26.04"]}
        - {plat.pm: apk}
        - {plat.pm: zypper, os.id: [opensuse-tumbleweed, opensuse-slowroll]}
  prefix:
    bins: [oras]
    applies_when:
      - method: [binary]
_dependencies:
  run:
    base:
      packages:
        - ca-certificates
    method-package:
      packages:
        - name: golang-oras
          version: "{feat.pm_version}"
          when: {plat.pm: [dnf, yum], os.id: fedora}
        - name: oras
          apk: oras-cli
          version: "{feat.pm_version}"
          when: {plat.pm: [apk, apt, brew, zypper]}
# installsAfter: []
