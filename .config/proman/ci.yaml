image:
  suffix: "-devcontainer"
  config_dir: ".devcontainer/.dev"
  userdata_dir: "/tmp/devcontainer-userdata"
  cache_ref_prefix: cache
  build_matrix:
    - runner: ubuntu-latest
      platform: linux/amd64
      platform_tag: linux-amd64
    - runner: ubuntu-24.04-arm
      platform: linux/arm64
      platform_tag: linux-arm64

artifacts:
  retention_days: 7
  src:
    name: ${{ name_slug }}$-src
    path: src/
  dist:
    name: ${{ name_slug }}$-dist
    path: dist/
  pages:
    name: github-pages
    path: .local/build/docs/website.tar

publish:
  registry: ghcr.io
  git_bot:
    name: "github-actions[bot]"
    email: "41898282+github-actions[bot]@users.noreply.github.com"
  pages_environment: github-pages

runner:
  free_disk_space:
    # Skip the whole cleanup step when free space on the runner already meets
    # this. Measured from real job telemetry (df -h / after the test step,
    # sampled across ~10 features spanning both runner disk layouts): a single
    # devcontainer-mode scenario job consistently consumes only 3-4GB, so 15GB
    # is already a ~4x margin. Raise if a job ever fails with ENOSPC.
    min_avail_gb: 15
    tool_cache: true
    swap_storage: true
    docker_images: true
    android: true
    dotnet: true
    haskell: true
    # Worst efficiency of all categories (~0.09 GiB/s vs 0.3-3.6 GiB/s for the
    # rest — seven sequential `apt-get remove` calls, each paying full
    # dependency-resolution overhead). Off by default; flip on for a run if
    # the other categories aren't enough.
    large_packages: false

scripts:
  features_src: "./src"

triggers:
  lint:
    - "**/*.sh"
    - "**/*.bash"
    - "**/*.bats"
  validate:
    - "**/metadata.yaml"
    - "**/*.schema.json"
    - "test/features/**/checks.yaml"
    - "test/features/**/scenarios.yaml"
  unit_test:
    - "lib/*.sh"
    - "lib/*.bash"
    - "lib/*.json"
    - "test/lib/**"
    - "test/support/**"
  install_test:
    - "features/install.tmpl.bash"
    - "features/install.sh"
    - "features/*/install.bash"
    - ".dev/lib/proman/sync/install_script.py"
    - "test/install/**"
    - "test/support/**"
  scenario_test:
    - "features/install.sh"
    - "lib/**"
    - "features/metadata.shared.yaml"
  devcontainer:
    - ".devcontainer/.dev/**"
    - ".github/workflows/build-devcontainer.yaml"
  docs:
    - "docs/**"
    - "features/**"
    - "lib/**"
    - ".config/proman/docs.yaml"
    - ".github/workflows/build-docs.yaml"
  python_test:
    - ".dev/lib/**"
    - ".config/proman/**"
    - "test/proman/**"
