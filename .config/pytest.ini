[pytest]
# cache_dir is resolved relative to pytest rootdir (repo root via --rootdir=. in pixi test-py).
cache_dir = .local/cache/pytest
addopts = -v --color=yes --capture=no
# GitTidy 0.3.2's default Loggerman/Rich initialization can close pytest's
# capture stream during teardown. Keep capture disabled until that dependency
# is capture-safe; use the configured `pixi run test-py` task.
